const pad2=n=>String(n).padStart(2,'0');

/* ===== GRADE 1 additions ===== */
S('g1ten',1,'Make ten','Count the empty boxes in the ten frame. That is how many more make 10.',()=>{const n=R(1,9);
  if(coin(.65))return num('How many more counters are needed to make <b>10</b>?',10-n,[`There are ${n} counters.`,`Count the empty boxes: ${10-n}.`,`${n} + <b>${10-n}</b> = 10`],{vis:vTenFrame(n)});
  return num(`<span class="big">${n} + __ = 10</span>Find the missing number.`,10-n,[`Think: what goes with ${n} to make 10?`,`10 − ${n} = <b>${10-n}</b>`])});
S('g1hund',1,'Hundred chart','Moving right adds 1. Moving down adds 10.',()=>{const r0=R(0,7),c0=R(0,7),mr=R(0,2),mcol=R(0,2),val=(r,c)=>(r0+r)*10+c0+c+1,ans=val(mr,mcol);
  const vis=`<table class="io" aria-label="Part of a hundred chart"><tbody>${range(0,2).map(r=>`<tr>${range(0,2).map(c=>`<td>${r===mr&&c===mcol?'<b>?</b>':val(r,c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  const st=mcol>0?[`The number to its left is ${ans-1}.`,`Moving right adds 1: ${ans-1} + 1 = <b>${ans}</b>`]:mr>0?[`The number above it is ${ans-10}.`,`Moving down adds 10: ${ans-10} + 10 = <b>${ans}</b>`]:[`The number to its right is ${ans+1}.`,`Moving left takes away 1: ${ans+1} − 1 = <b>${ans}</b>`];
  return num('What number is missing from this part of the hundred chart?',ans,st,{vis})});
S('g1tml',1,'Ten more or ten less','Ten more changes the tens digit up by 1. The ones digit stays the same.',()=>{const n=R(10,89),up=coin(),a=up?n+10:n-10;
  return num(`What is <b>ten ${up?'more':'less'}</b> than ${n}?`,a,[`The tens digit goes ${up?'up':'down'} by 1: ${Math.floor(n/10)} tens becomes ${Math.floor(a/10)} tens.`,`The ones digit stays ${n%10}.`,`${n} ${up?'+':'−'} 10 = <b>${a}</b>`])});
S('g1sub2',1,'Subtract from a two-digit number','Take away the ones from the ones, or the tens from the tens.',()=>{let a;do{a=R(21,99)}while(a%10===0);if(coin()){const b=R(1,a%10);return num(`<span class="big">${a} − ${b} = ?</span>`,a-b,[`Take away the ones: ${a%10} − ${b} = ${a%10-b}.`,`The tens stay the same: ${Math.floor(a/10)} tens.`,`${a} − ${b} = <b>${a-b}</b>`])}
  const b=10*R(1,Math.floor(a/10)-1);return num(`<span class="big">${a} − ${b} = ?</span>`,a-b,[`Take away the tens: ${Math.floor(a/10)} tens − ${b/10} tens = ${Math.floor(a/10)-b/10} tens.`,`The ones stay the same: ${a%10}.`,`${a} − ${b} = <b>${a-b}</b>`])});
S('g1sign',1,'Plus or minus?','Try adding, then try taking away. Which one gives the answer?',()=>{const a=R(5,15),b=R(1,Math.min(9,a-1)),plus=coin(),c=plus?a+b:a-b,s=plus?'+':'−';
  return choice(`Which sign makes this true?<span class="big">${a} ○ ${b} = ${c}</span>`,s,['+','−'],[`Try both: ${a} + ${b} = ${a+b} and ${a} − ${b} = ${a-b}.`,`The answer ${c} comes from ${plus?'adding':'taking away'}, so the sign is <b>${s}</b>.`],{optClass:'sym'})});
S('g1ruler',1,'Measure with a ruler','Line the object up at 0. Read the number at its end.',()=>{const st=coin(.7)?0:R(1,3),e=R(st+2,10);
  return num('How long is the crayon?',e-st,st?[`The crayon starts at ${st}, not 0.`,`It ends at ${e}. Count the centimetres between: ${e} − ${st} = <b>${e-st}</b>.`]:[`The crayon starts at 0.`,`Its end lines up with <b>${e}</b>, so it is ${e} cm long.`],{vis:vRuler(st,e),unit:'cm'})});
S('g1heavy',1,'Heavier, lighter, holds more','Think about lifting each thing, or filling it with water.',()=>{const W=[['🪶','feather'],['🍓','strawberry'],['🍎','apple'],['📕','book'],['🍉','watermelon'],['🚲','bike'],['🐄','cow'],['🚗','car'],['🐘','elephant']],C=[['🥄','spoon'],['☕','cup'],['🪣','bucket'],['🛁','bathtub']];
  const cap=coin(.3),list=cap?C:W;let idx;do{idx=SH(range(0,list.length-1)).slice(0,3).sort((x,y)=>x-y)}while(!cap&&(idx[1]-idx[0]<2||idx[2]-idx[1]<2));const most=coin(),pick=list[most?idx[2]:idx[0]],lab=x=>`${x[0]} ${x[1]}`;
  const q=cap?`Which one holds the <b>${most?'most':'least'}</b> water?`:`Which one is the <b>${most?'heaviest':'lightest'}</b>?`;
  return choice(q,lab(pick),idx.map(i=>lab(list[i])),[cap?'Imagine filling each one with water.':'Imagine lifting each one.',`The ${pick[1]} ${cap?(most?'holds the most':'holds the least'):(most?'is the heaviest':'is the lightest')}: <b>${lab(pick)}</b>.`],{shuffle:true})});
S('g1like',1,'Certain, possible or impossible','Look at what is in the bag. Is the colour always there, sometimes, or never?',()=>{const cols=['red','blue','green','yellow'],t=P(cols),kind=P(['certain','possible','impossible']),counts={};
  if(kind==='certain')counts[t]=R(3,8);else if(kind==='impossible'){SH(cols.filter(c=>c!==t)).slice(0,R(1,2)).forEach(c=>counts[c]=R(2,5))}else{counts[t]=R(1,5);counts[P(cols.filter(c=>c!==t))]=R(1,5)}
  const st=kind==='certain'?[`Every marble in the bag is ${t}.`,`So picking ${t} is <b>certain</b>.`]:kind==='impossible'?[`There are no ${t} marbles in the bag.`,`So picking ${t} is <b>impossible</b>.`]:[`Some marbles are ${t} and some are not.`,`So picking ${t} is <b>possible</b>.`];
  return choice(`You pick one marble without looking. Is picking a <b>${t}</b> marble certain, possible or impossible?`,kind,['certain','possible','impossible'],st,{vis:vBag(counts)})});
S('g1pos',1,'Left, right and between','Your left hand is on the left side of the row.',()=>{const s=SH(EMO).slice(0,5),t=R(0,2);let q,a,st;
  if(t===0){const i=R(1,4);a=s[i-1];q=`What is just to the <b>left</b> of ${s[i]}?`;st=[`Find ${s[i]}. Look one step to the left.`,`It is <b>${a}</b>.`]}
  else if(t===1){const i=R(0,3);a=s[i+1];q=`What is just to the <b>right</b> of ${s[i]}?`;st=[`Find ${s[i]}. Look one step to the right.`,`It is <b>${a}</b>.`]}
  else{const i=R(1,3);a=s[i];q=`What is <b>between</b> ${s[i-1]} and ${s[i+1]}?`;st=[`Find ${s[i-1]} and ${s[i+1]}.`,`The one in the middle is <b>${a}</b>.`]}
  return choice(q,a,[a,...SH(s.filter(x=>x!==a)).slice(0,3)],st,{vis:`<span class="emo" style="text-align:center">${s.join(' ')}</span>`,optClass:'emoji',shuffle:true})});

/* ===== GRADE 2 additions ===== */
S('g2rom',2,'Roman numerals to 50','I = 1, V = 5, X = 10, L = 50. A smaller numeral before a bigger one means take away.',()=>{const n=R(1,50),t=n-n%10,o=n%10,parts=[t,o].filter(Boolean),R2=toRoman(n);
  const st=[`Split ${n} into ${parts.join(' + ')}.`,...parts.map(p=>`${p} = ${toRoman(p)}`)];
  if(coin())return mc(`What is <b>${n}</b> in Roman numerals?`,R2,[toRoman(n+1),toRoman(Math.max(1,n-1)),toRoman(n+5),toRoman(n+10),o===4?toRoman(t)+'IIII':toRoman(n+2)],[...st,`So ${n} = <b>${R2}</b>.`],{optClass:'sym'});
  return num(`What number is <b>${R2}</b>?`,n,[`Read the numerals in parts: ${parts.map(p=>toRoman(p)).join(' + ')}.`,...parts.map(p=>`${toRoman(p)} = ${p}`),`${parts.join(' + ')} = <b>${n}</b>`])});
S('g2add3n',2,'Add three two-digit numbers','Add all the tens, add all the ones, then put them together.',()=>{let a,b,c;do{a=R(10,40);b=R(10,40);c=R(10,40)}while(a+b+c>99);const T=[a,b,c].map(x=>x-x%10),O=[a,b,c].map(x=>x%10);
  return num(`<span class="big">${a} + ${b} + ${c} = ?</span>`,a+b+c,[`Add the tens: ${T.join(' + ')} = ${sum(T)}.`,`Add the ones: ${O.join(' + ')} = ${sum(O)}.`,`${sum(T)} + ${sum(O)} = <b>${a+b+c}</b>`])});
S('g2dollar',2,'How much more to make a dollar?','A dollar is 100¢. Count up from the coins to 100.',()=>{const c=5*R(1,19);let left=c;const list=[];for(const k of['q','d','n'])while(left>=COIN[k].v){list.push(k);left-=COIN[k].v}
  return num('How many more cents do you need to make <b>one dollar</b>?',100-c,[`The coins make ${c}¢.`,`A dollar is 100¢.`,`100 − ${c} = <b>${100-c}</b>¢`],{vis:vCoins(list),unit:'¢'})});
S('g2therm',2,'Read a thermometer','Find how much each small mark is worth, then count up from the last big number.',()=>{const T=2*R(0,20),b=T-T%10;
  return num('What temperature does the thermometer show?',T,[`The big numbers count by 10s. Each small mark is 2 degrees.`,T%10?`The red line is past ${b}. Count up by 2s: ${range(1,(T-b)/2).map(i=>b+2*i).join(', ')}.`:`The red line stops right at ${T}.`,`The temperature is <b>${T}</b>°C.`],{vis:vThermo(T),unit:'°C'})});
S('g2el',2,'How many hours?','Count the hours from the start time to the end time.',()=>{const h=R(1,10),m=P([0,30]),d=R(1,4),e=(h-1+d)%12+1;
  return num(`A movie starts at <b>${tm(h,m)}</b> and ends at <b>${tm(e,m)}</b>. How many hours long is it?`,d,[`Count the hours from ${tm(h,m)}: ${range(1,d).map(i=>tm((h-1+i)%12+1,m)).join(', ')}.`,`That is <b>${d}</b> hour${d>1?'s':''}.`],{unit:'hours'})});
S('g2lplot',2,'Read a line plot','Each ✕ is one person. Count the ✕ marks above the number.',()=>{let c;do{c=range(0,4).map(()=>R(0,4))}while(sum(c)<5);const t=R(0,2),vis=vLinePlot(c,0,'Number of pets');
  if(t===0){const v=R(0,4);return num(`How many children have <b>${v}</b> pet${v===1?'':'s'}?`,c[v],[`Find ${v} on the line and count the ✕ marks above it.`,`There ${c[v]===1?'is':'are'} <b>${c[v]}</b>.`],{vis})}
  if(t===1)return num('How many children answered in all?',sum(c),[`Count the ✕ marks above each number: ${c.join(', ')}.`,`${c.join(' + ')} = <b>${sum(c)}</b>`],{vis});
  const v=R(0,2),more=c.slice(v+1);return num(`How many children have <b>more than ${v}</b> pet${v===1?'':'s'}?`,sum(more),[`More than ${v} means ${range(v+1,4).join(', ')}.`,`Add those columns: ${more.join(' + ')} = <b>${sum(more)}</b>`],{vis})});
S('g2bar',2,'Read a bar graph','Look at the top of the bar and read across to the numbers.',()=>{const C=SH(['Apples','Grapes','Pears','Plums','Kiwis']).slice(0,4);let v;do{v=C.map(()=>2*R(1,5))}while(new Set(v).size<3);const vis=vBars(C,v,2,10),i=R(0,3);
  if(coin())return num(`How many children chose <b>${C[i].toLowerCase()}</b>?`,v[i],[`Find the ${C[i]} bar and read across from its top.`,`It reaches <b>${v[i]}</b>.`],{vis});
  let j;do{j=R(0,3)}while(v[j]===v[i]);const[hi,lo]=v[i]>v[j]?[i,j]:[j,i];return num(`How many more chose <b>${C[hi].toLowerCase()}</b> than <b>${C[lo].toLowerCase()}</b>?`,v[hi]-v[lo],[`${C[hi]}: ${v[hi]}. ${C[lo]}: ${v[lo]}.`,`${v[hi]} − ${v[lo]} = <b>${v[hi]-v[lo]}</b>`],{vis})});
S('g2ampm',2,'A.M. or P.M.','A.M. is from midnight to noon. P.M. is from noon to midnight.',()=>{const L=[['eats breakfast',P([6,7]),P([0,15,30]),'A.M.'],['walks to school',8,P([0,15,30]),'A.M.'],['wakes up',P([6,7]),P([0,30,45]),'A.M.'],['has morning recess',10,P([0,15,30]),'A.M.'],['goes to bed',P([8,9]),P([0,15,30]),'P.M.'],['eats supper',P([5,6]),P([0,15,30]),'P.M.'],['has soccer practice after school',4,P([0,15,30]),'P.M.'],['reads a bedtime story',P([7,8]),P([30,45]),'P.M.']],x=P(L),n=P(NAMES);
  return choice(`${n} ${x[0]} at <b>${tm(x[1],x[2])}</b>. Is that A.M. or P.M.?`,x[3],['A.M.','P.M.'],[`A.M. is the morning, before noon. P.M. is after noon.`,`${n} ${x[0]} in the ${x[3]==='A.M.'?'morning':(x[1]>=7?'evening':'afternoon or evening')}, so it is <b>${x[3]}</b>.`],{optClass:'sym'})});
S('g2mode',2,'Find the mode','The mode is the number you see most often.',()=>{const p=SH(range(1,9)),m=p[0],l=SH([m,m,m,p[1],p[1],p[2],p[3]]);
  return num(`Which number appears most often?<span class="big">${l.join(', ')}</span>`,m,[`Count each number: ${m} appears 3 times, ${p[1]} appears 2 times, the others once.`,`The mode is <b>${m}</b>.`])});

/* ===== GRADE 3 additions ===== */
S('g3two',3,'Two-step word problems','Find the first answer, then use it to find the second.',()=>{const n=P(NAMES),i=P(ITEMS),t=R(0,3);
  if(t===0){const a=R(20,90),b=R(2,6),c=R(5,12);return num(`${n} has ${a} ${i}. ${n} buys ${b} packs with ${c} ${i} in each pack. How many ${i} does ${n} have now?`,a+b*c,[`Step 1: ${b} × ${c} = ${b*c} new ${i}.`,`Step 2: ${a} + ${b*c} = <b>${a+b*c}</b>`])}
  if(t===1){const a=R(2,6),p=R(4,12),b=R(2,6),q=R(2,8);return num(`Tickets cost $${p} for adults and $${q} for children. How much do ${a} adult and ${b} child tickets cost (in dollars)?`,a*p+b*q,[`Adults: ${a} × $${p} = $${a*p}.`,`Children: ${b} × $${q} = $${b*q}.`,`$${a*p} + $${b*q} = <b>$${a*p+b*q}</b>`],{unit:'dollars'})}
  if(t===2){const a=R(40,90),b=R(10,a-10),c=R(5,30);return num(`${n} had ${a} ${i}, gave away ${b}, then found ${c} more. How many ${i} does ${n} have now?`,a-b+c,[`Step 1: ${a} − ${b} = ${a-b}.`,`Step 2: ${a-b} + ${c} = <b>${a-b+c}</b>`])}
  const per=R(2,9),f=R(2,6),e=R(1,9),a=per*f+e;return num(`${n} baked ${a} cookies and ate ${e}. ${n} shares the rest equally with ${f} friends. How many cookies does each friend get?`,per,[`Step 1: ${a} − ${e} = ${a-e} cookies left.`,`Step 2: ${a-e} ÷ ${f} = <b>${per}</b>`])});
S('g3props',3,'Properties of multiplication','You can multiply in any order. Any number times 1 stays the same. Any number times 0 is 0.',()=>{const a=R(2,12),b=R(2,12),t=R(0,3);
  if(t===0)return num(`<span class="big">${a} × ${b} = ${b} × __</span>Find the missing number.`,a,[`You can multiply in any order and get the same answer.`,`${a} × ${b} = ${b} × <b>${a}</b>`]);
  if(t===1){const z=coin();return num(`<span class="big">${a*b} × ${z?0:1} = ?</span>`,z?0:a*b,z?[`Any number times 0 is 0.`,`${a*b} × 0 = <b>0</b>`]:[`Any number times 1 stays the same.`,`${a*b} × 1 = <b>${a*b}</b>`])}
  if(t===2){const c=R(2,5);return num(`<span class="big">(${a} × ${c}) × ${b} = ${a} × (${c} × __)</span>Find the missing number.`,b,[`You can group the numbers in any way when you multiply.`,`So the missing number is <b>${b}</b>.`])}
  const p=R(2,b-1);return num(`<span class="big">${a} × ${b} = ${a} × ${p} + ${a} × __</span>Find the missing number.`,b-p,[`Split ${b} into ${p} + ${b-p}.`,`${a} × ${b} = ${a} × ${p} + ${a} × <b>${b-p}</b>`])});
S('g3rem',3,'Share with leftovers','Share into equal groups. What does not fit is the remainder.',()=>{const d=R(2,9),q=R(2,9),r=R(1,d-1),n=d*q+r,i=P(ITEMS),w=coin();
  return num(`${n} ${i} are shared equally among ${d} friends. ${w?'How many are left over?':'How many does each friend get?'}`,w?r:q,[`${d} × ${q} = ${d*q}, and ${d} × ${q+1} = ${d*(q+1)} is too many.`,`Each friend gets ${q}. ${n} − ${d*q} = ${r} left over.`,`The answer is <b>${w?r:q}</b>.`])});
S('g3change',3,'Make change by counting up','Count up from the price to the next dollar, then up to the money paid.',()=>{const pay=P([5,10,20]),p=100*R(1,pay-1)+5*R(1,19),ch=pay*100-p,up=(100-p%100)%100;
  return mc(`${P(NAMES)} buys a snack for <b>${fm(p)}</b> and pays with a <b>$${pay}</b> bill. How much change?`,fm(ch),[fm(ch+100),fm(ch-100),fm(ch+25),fm(ch-25),fm(ch+10)],[`Count up from ${fm(p)} to ${fm(p+up)}: that is ${fm(up)}.`,`Count up from ${fm(p+up)} to $${pay}.00: that is ${fm(pay*100-p-up)}.`,`${fm(up)} + ${fm(pay*100-p-up)} = <b>${fm(ch)}</b>`])});
S('g3h24',3,'12-hour and 24-hour time','After noon, add 12 to the hour for 24-hour time.',()=>{const h=R(1,12),m=P([0,5,10,15,20,30,45,50]),pm=coin(),H=pm?(h%12)+12:h%12,t24=`${pad2(H)}:${pad2(m)}`,t12=`${h}:${pad2(m)} ${pm?'p.m.':'a.m.'}`;
  const why=H===0?`12 a.m. is midnight, which is 00 in 24-hour time.`:H<12?`A.M. hours stay the same.`:H===12?`12 p.m. is noon, which is 12 in 24-hour time.`:`For P.M. hours after noon, add 12: ${h} + 12 = ${H}.`;
  if(coin())return mc(`Write <b>${t12}</b> in 24-hour time.`,t24,[`${pad2((H+12)%24)}:${pad2(m)}`,`${pad2(h)}:${pad2(m)}`,`${pad2((H+2)%24)}:${pad2(m)}`,`${pad2((H+10)%24)}:${pad2(m)}`],[why,`So ${t12} is <b>${t24}</b>.`],{optClass:'sym'});
  const why2=H===0?`00 is midnight, so it is 12 a.m.`:H<12?`Hours before 12 are a.m.`:H===12?`12 is noon, so it is p.m.`:`Subtract 12 from the hour: ${H} − 12 = ${h}, and it is p.m.`,flip=`${h}:${pad2(m)} ${pm?'a.m.':'p.m.'}`;
  return mc(`Write <b>${t24}</b> in 12-hour time.`,t12,[flip,`${(h%12)+1}:${pad2(m)} ${pm?'p.m.':'a.m.'}`,`${((h+10)%12)+1}:${pad2(m)} ${pm?'p.m.':'a.m.'}`],[why2,`So ${t24} is <b>${t12}</b>.`])});
S('g3freq',3,'Read a frequency table','Each row shows how many chose that answer.',()=>{const A=SH(['Swimming','Hockey','Dance','Art','Soccer','Music']).slice(0,4);let c;do{c=A.map(()=>R(2,15))}while(new Set(c).size<4);const t=R(0,2);
  const vis=`<table class="io"><thead><tr><th>Activity</th><th>Students</th></tr></thead><tbody>${A.map((a,i)=>`<tr><td style="text-align:left">${a}</td><td>${c[i]}</td></tr>`).join('')}</tbody></table>`;
  if(t===0){const i=R(0,3);return num(`How many students chose <b>${A[i].toLowerCase()}</b>?`,c[i],[`Find the ${A[i]} row.`,`It says <b>${c[i]}</b>.`],{vis})}
  if(t===1){const s=[0,1,2,3].sort((x,y)=>c[y]-c[x]),i=s[0],j=s[R(1,3)];return num(`How many more students chose <b>${A[i].toLowerCase()}</b> than <b>${A[j].toLowerCase()}</b>?`,c[i]-c[j],[`${A[i]}: ${c[i]}. ${A[j]}: ${c[j]}.`,`${c[i]} − ${c[j]} = <b>${c[i]-c[j]}</b>`],{vis})}
  return num('How many students answered in all?',sum(c),[`Add every row: ${c.join(' + ')}.`,`= <b>${sum(c)}</b>`],{vis})});
S('g3lgraph',3,'Read a line graph','Find the day on the bottom, go up to the dot, then read across.',()=>{const D=['Mon','Tue','Wed','Thu','Fri'],full=['Monday','Tuesday','Wednesday','Thursday','Friday'];let v;do{v=D.map(()=>5*R(1,6))}while(new Set(v).size<4);const vis=vLineGraph(D,v,5,30,'Temperature at noon (°C)'),t=R(0,2);
  if(t===0){const i=R(0,4);return num(`What was the temperature on <b>${full[i]}</b>?`,v[i],[`Find ${D[i]} at the bottom and go up to the dot.`,`Read across: <b>${v[i]}</b>°C.`],{vis,unit:'°C'})}
  if(t===1){let i,j;do{i=R(0,4);j=R(0,4)}while(v[i]<=v[j]);return num(`How much warmer was <b>${full[i]}</b> than <b>${full[j]}</b>?`,v[i]-v[j],[`${full[i]}: ${v[i]}°C. ${full[j]}: ${v[j]}°C.`,`${v[i]} − ${v[j]} = <b>${v[i]-v[j]}</b> degrees`],{vis,unit:'°C'})}
  const mx=Math.max(...v);if(v.filter(x=>x===mx).length>1)return SK.g3lgraph.gen();const i=v.indexOf(mx);return choice('Which day was the <b>warmest</b>?',full[i],full,[`The warmest day has the highest dot.`,`That is <b>${full[i]}</b>, at ${mx}°C.`],{vis})});
S('g3quad',3,'Name the quadrilateral','Check the sides (equal? parallel?) and the corners (square corners?).',()=>{const T=['square','rectangle','rhombus','parallelogram','trapezoid'],t=P(T),why={square:'It has 4 equal sides and 4 right angles',rectangle:'It has 4 right angles, but its sides are not all equal',rhombus:'It has 4 equal sides, but no right angles',parallelogram:'Opposite sides are equal and parallel, with no right angles',trapezoid:'Only one pair of sides is parallel'}[t];
  return choice('What is the best name for this shape?',t,T,[`Look at the tick marks (equal sides) and the corner marks (right angles).`,`${why}. It is a <b>${t}</b>.`],{vis:vQuad(t)})});
S('g3tri',3,'Triangles by their sides','Equilateral: 3 equal sides. Isosceles: 2 equal sides. Scalene: no equal sides.',()=>{const t=P(['equilateral','isosceles','scalene']);let a,b,c;
  if(t==='equilateral'){a=b=c=R(3,12)}else if(t==='isosceles'){a=R(4,12);do{c=R(3,Math.min(2*a-1,15))}while(c===a);b=a}else{do{[a,b,c]=[R(3,12),R(3,12),R(3,12)]}while(new Set([a,b,c]).size<3||a+b<=c||a+c<=b||b+c<=a||Math.max(a,b,c)-Math.min(a,b,c)<2)}
  const eq=t==='equilateral'?3:t==='isosceles'?2:0;return choice('What kind of triangle is this?',t,['equilateral','isosceles','scalene'],[`The sides are ${c} cm, ${a} cm and ${b} cm.`,eq?`${eq} sides are equal.`:'No sides are equal.',`So it is <b>${t}</b>.`],{vis:vTriSides(a,b,c,'cm')})});

/* ===== GRADE 4 additions ===== */
S('g4words',4,'Number names to 999,999','Read the part before the comma, say "thousand", then read the rest.',()=>{const n=R(10000,999999),th=Math.floor(n/1000),r=n%1000,st=[`Split at the comma: ${fmtN(th)} thousand and ${r}.`];
  if(coin()){const d=String(n).split('');const k=R(1,d.length-2);[d[k],d[k+1]]=[d[k+1],d[k]];const sw=+d.join('');return mc(`How do you write <b>${fmtN(n)}</b> in words?`,numWords(n),[numWords(sw),numWords(n+(n<990000?10000:-10000)),numWords(Math.floor(n/10)),numWords(n+100)],[...st,`<b>${numWords(n)}</b>`])}
  return num(`Write this number with digits: <b>${numWords(n)}</b>`,n,[...st,`${fmtN(th)} thousand + ${r} = <b>${fmtN(n)}</b>`])});
S('g4cmp',4,'Compare numbers to 999,999','Compare digits from the left. The first place that is different decides.',()=>{const a=R(100000,999999),b=coin(.1)?a:Math.min(999999,Math.max(100000,a+(coin()?1:-1)*R(1,9)*10**R(0,4))),s=cmpSign(a,b);
  return choice(`Which sign goes in the circle?<span class="big">${fmtN(a)} ○ ${fmtN(b)}</span>`,s,SIGNS,cmpSteps(a,b,s),{optClass:'sym',cols:3})});
S('g4est',4,'Estimate products','Round the bigger number first, then multiply.',()=>{const big=coin(),b=R(3,9);let a;do{a=big?R(110,890):R(12,98)}while(a%(big?100:10)===0);const p=big?100:10,ra=Math.round(a/p)*p;
  return num(`Estimate <b>${a} × ${b}</b> by rounding ${a} to the nearest ${p===100?'hundred':'ten'}.`,ra*b,[`${a} rounds to ${ra}.`,`${ra} × ${b} = <b>${fmtN(ra*b)}</b>`])});
S('g4distr',4,'The distributive property','Split a number into tens and ones, multiply each part, then add.',()=>{const a=R(3,9);let b;do{b=R(12,49)}while(b%10===0);const t=b-b%10,o=b%10,k=R(0,2);
  if(k===0)return num(`<span class="big">${a} × ${b} = ${a} × ${t} + ${a} × __</span>Find the missing number.`,o,[`Split ${b} into ${t} + ${o}.`,`So ${a} × ${b} = ${a} × ${t} + ${a} × <b>${o}</b>`]);
  if(k===1)return num(`<span class="big">${a} × ${b} = ${a} × __ + ${a} × ${o}</span>Find the missing number.`,t,[`Split ${b} into ${t} + ${o}.`,`So ${a} × ${b} = ${a} × <b>${t}</b> + ${a} × ${o}`]);
  return num(`Split ${b} into tens and ones to find <b>${a} × ${b}</b>.`,a*b,[`${a} × ${t} = ${a*t}`,`${a} × ${o} = ${a*o}`,`${a*t} + ${a*o} = <b>${a*b}</b>`])});
S('g4fadd',4,'Add and subtract fractions with like denominators','When the bottoms match, add or subtract the tops. The bottom stays the same.',()=>{const d=R(3,12),ad=coin();let a,b;if(ad){a=R(1,d-2);b=R(1,d-1-a)}else{a=R(2,d-1);b=R(1,a-1)}const res=ad?a+b:a-b,ans=fr(res,d),o=ad?'+':'−';
  const st=[`The bottom numbers are both ${d}, so ${ad?'add':'subtract'} the tops: ${a} ${o} ${b} = ${res}.`,`Keep the bottom: ${res}/${d}.`];if(ans!==`${res}/${d}`)st.push(`Simplify: ${res}/${d} = <b>${ans}</b>`);else st[1]=`Keep the bottom: <b>${ans}</b>`;
  return mc(`<span class="big">${a}/${d} ${o} ${b}/${d} = ?</span>`,ans,[`${ad?a+b:a-b}/${ad?2*d:d+1}`,`${res+1}/${d}`,`${ad?Math.abs(a-b)||1:a+b}/${d}`,`${res}/${2*d+1}`],st,{optClass:'sym'})});
S('g4dnl',4,'Decimals on a number line','There are 10 equal jumps between whole numbers. Each jump is one tenth.',()=>{const w=R(0,9),k=R(1,9),ans=`${w}.${k}`;
  return num('What decimal does the dot show?',ans,[`From ${w} to ${w+1} there are 10 equal jumps, so each jump is 0.1.`,`The dot is ${k} jump${k>1?'s':''} past ${w}.`,`It shows <b>${ans}</b>.`],{vis:vNumberLine({min:w,max:w+1,step:.1,dot:w+k/10,labels:'ends',fmt:v=>String(Math.round(v))})})});
S('g4d2f',4,'Decimals as fractions','Tenths go over 10. Hundredths go over 100.',()=>{if(coin(.4)){const k=R(1,9);return num(`<span class="big">0.${k} = __/10</span>Find the missing top number.`,k,[`0.${k} is ${k} tenths.`,`${k} tenths = <b>${k}</b>/10`])}
  let n;do{n=R(1,99)}while(n%10===0);return num(`<span class="big">0.${pad2(n)} = __/100</span>Find the missing top number.`,n,[`0.${pad2(n)} is ${n} hundredths.`,`${n} hundredths = <b>${n}</b>/100`])});
S('g4turn',4,'Turns and degrees','A full turn is 360°. A quarter turn is 90°.',()=>{if(coin(.4)){const t=P([['a quarter turn','1/4',90],['a half turn','1/2',180],['a three-quarter turn','3/4',270],['a full turn','1',360]]);return num(`How many degrees are in <b>${t[0]}</b>?`,t[2],[`A full turn is 360°.`,`${t[1]} of 360° = <b>${t[2]}</b>°`],{unit:'°'})}
  const D=['north','east','south','west'],i=R(0,3),k=R(1,3),cw=coin(),path=range(0,k).map(j=>D[(i+(cw?j:-j)+8)%4]),e=path[k];
  return num(`You face <b>${D[i]}</b> and turn <b>${cw?'clockwise':'counterclockwise'}</b> until you face <b>${e}</b>. How many degrees did you turn?`,k*90,[`Follow the turn: ${path.join(' → ')}.`,`That is ${plural(k,'quarter turn')}: ${k} × 90 = <b>${k*90}</b>°`],{unit:'°',vis:vCompass()})});
S('g4dbar',4,'Read a double bar graph','The key shows which colour is which group.',()=>{const M=['Jan','Feb','Mar','Apr'],MF=['January','February','March','April'],names=['Room 4A','Room 4B'];let A,B;do{A=M.map(()=>R(1,10));B=M.map(()=>R(1,10))}while(A.every((x,i)=>x===B[i]));const vis=vDBars(M,A,B,names,2,10),t=R(0,2);
  if(t===0){const i=R(0,3),g=R(0,1),v=g?B[i]:A[i];return num(`How many books did <b>${names[g]}</b> read in <b>${MF[i]}</b>?`,v,[`${names[g]} is the ${g?'orange':'blue'} bar.`,`In ${MF[i]} that bar reaches <b>${v}</b>.`],{vis})}
  if(t===1){const ok=M.map((_,i)=>i).filter(i=>A[i]!==B[i]),i=P(ok),hi=A[i]>B[i]?0:1,d=Math.abs(A[i]-B[i]);return num(`In <b>${MF[i]}</b>, how many more books did <b>${names[hi]}</b> read than ${names[1-hi]}?`,d,[`${MF[i]}: ${names[0]} ${A[i]}, ${names[1]} ${B[i]}.`,`${Math.max(A[i],B[i])} − ${Math.min(A[i],B[i])} = <b>${d}</b>`],{vis})}
  const g=R(0,1),arr=g?B:A;return num(`How many books did <b>${names[g]}</b> read in all four months?`,sum(arr),[`Read each ${g?'orange':'blue'} bar: ${arr.join(', ')}.`,`${arr.join(' + ')} = <b>${sum(arr)}</b>`],{vis})});

/* ===== GRADE 5 additions ===== */
S('g5mil',5,'Place value to millions','Name the place of the digit, then multiply by that place value.',()=>{let d;do{d=range(1,7).map(()=>R(1,9))}while(new Set(d).size<7);const p=R(0,6),pl=6-p,v=d[p]*10**pl;
  return num(`What is the value of the digit <b>${d[p]}</b> in <b>${fmtN(+d.join(''))}</b>?`,v,[`The ${d[p]} is in the ${PLACES[pl]} place.`,`${d[p]} × ${fmtN(10**pl)} = <b>${fmtN(v)}</b>`])});
S('g5mul32',5,'Multiply 3 digits by 2 digits','Multiply by the tens, then by the ones, then add the two answers.',()=>{const a=R(101,999);let b;do{b=R(12,99)}while(b%10===0);const t=b-b%10,o=b%10;
  return num(`<span class="big">${a} × ${b} = ?</span>`,a*b,[`Split ${b} into ${t} + ${o}.`,`${a} × ${t} = ${fmtN(a*t)}`,`${a} × ${o} = ${fmtN(a*o)}`,`${fmtN(a*t)} + ${fmtN(a*o)} = <b>${fmtN(a*b)}</b>`])});
S('g5div2',5,'Divide by a two-digit number','Take out easy chunks like 10 or 20 groups, then add up the chunks.',()=>{const d=R(12,35),q=R(11,99),n=d*q,st=[];let left=n;for(const c of[50,20,10,5,2,1])while(left>=d*c){st.push(`${d} × ${c} = ${fmtN(d*c)}, leaving ${fmtN(left-d*c)}`);left-=d*c}
  return num(`<span class="big">${fmtN(n)} ÷ ${d} = ?</span>`,q,[`Take out groups of ${d}:`,...st,`Add the groups: <b>${q}</b>`])});
S('g5fofn',5,'Fraction of a number','Divide by the bottom number, then multiply by the top number.',()=>{const b=P([3,4,5,6,8,10]),a=R(1,b-1),n=b*R(3,12),ctx=P([['students in a class','walk to school'],['marbles in a jar','are blue'],['pages in a book','have pictures'],['seats on a bus','are taken']]);
  return num(`There are ${n} ${ctx[0]}. <b>${a}/${b}</b> of them ${ctx[1]}. How many is that?`,a*n/b,[`Find 1/${b}: ${n} ÷ ${b} = ${n/b}.`,`Then ${a}/${b}: ${a} × ${n/b} = <b>${a*n/b}</b>`])});
S('g5p10',5,'Multiply and divide by 10, 100, 1000','Multiplying moves the digits left. Dividing moves them right.',()=>{let m;do{m=R(101,9999)}while(m%10===0);const k=R(1,3),p=10**k,x=(m/100).toFixed(2),mul=coin(),ans=mul?decStr(m*p,2):decStr(m,2+k);
  return num(`<span class="big">${x} ${mul?'×':'÷'} ${fmtN(p)} = ?</span>`,ans,[`${mul?'Multiplying':'Dividing'} by ${fmtN(p)} moves every digit ${plural(k,'place')} to the ${mul?'left':'right'}.`,`${x} ${mul?'×':'÷'} ${fmtN(p)} = <b>${ans}</b>`])});
S('g5rdec',5,'Round decimals','Look at the digit just after the place you are rounding to. 5 or more rounds up.',()=>{let m;do{m=R(1001,99999)}while(m%10===0);const t=R(0,2),f=10**(3-t),dg=Math.floor(m%f/(f/10)),r=Math.floor(m/f)+(dg>=5?1:0),a=(r/10**t).toFixed(t),x=(m/1000).toFixed(3),pn=['whole number','tenth','hundredth'][t];
  return num(`Round <b>${x}</b> to the nearest <b>${pn}</b>.`,a,[`Look at the ${['tenths','hundredths','thousandths'][t]} digit: ${dg}.`,dg>=5?'It is 5 or more, so round up.':'It is less than 5, so round down.',`${x} rounds to <b>${a}</b>.`])});
S('g5para',5,'Area of a parallelogram','Area = base × height. Use the straight-up height, not the slanted side.',()=>{const b=R(4,12),h=R(3,9),sl=h+R(1,3);
  return num('What is the area of this parallelogram?',b*h,[`Use the base (${b} cm) and the height (${h} cm). The ${sl} cm slanted side is not the height.`,`${b} × ${h} = <b>${b*h}</b> square cm`],{vis:vPara(b,h,sl),unit:'sq cm'})});
S('g5circ',5,'Radius and diameter','The diameter goes all the way across. It is 2 times the radius.',()=>{const r=R(2,25);
  if(coin())return num('The radius is shown. What is the diameter of this circle?',2*r,[`The diameter is 2 times the radius.`,`2 × ${r} = <b>${2*r}</b> cm`],{vis:vCircle(r,false),unit:'cm'});
  return num('The diameter is shown. What is the radius of this circle?',r,[`The radius is half of the diameter.`,`${2*r} ÷ 2 = <b>${r}</b> cm`],{vis:vCircle(2*r,true),unit:'cm'})});
S('g5budget',5,'Budgets and saving','Add up what is spent, then subtract from what is earned.',()=>{const n=P(NAMES),t=R(0,2);
  if(t===0){const A=5*R(4,10),x=R(3,Math.floor(A/3)),y=R(2,Math.floor(A/3));return num(`${n} gets $${A} for the week, spends $${x} on a book and $${y} on snacks, and saves the rest. How much does ${n} save (in dollars)?`,A-x-y,[`Spent: $${x} + $${y} = $${x+y}.`,`Saved: $${A} − $${x+y} = <b>$${A-x-y}</b>`],{unit:'dollars'})}
  if(t===1){const w=R(5,20),k=R(3,12),c=w*k,it=P(['scooter','video game','pair of skates','telescope']);return num(`${n} saves $${w} each week to buy a $${c} ${it}. How many weeks will it take?`,k,[`Divide the price by the amount saved each week.`,`$${c} ÷ $${w} = <b>${k}</b> weeks`],{unit:'weeks'})}
  const p=R(4,12),k=R(3,9),s=R(5,p*k-5);return num(`${n} earns $${p} for each dog walk, does ${k} walks, then spends $${s} on a gift. How much money is left (in dollars)?`,p*k-s,[`Earned: ${k} × $${p} = $${p*k}.`,`$${p*k} − $${s} = <b>$${p*k-s}</b>`],{unit:'dollars'})});

const today=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const dayOffset=n=>{const d=new Date();d.setDate(d.getDate()-n);return today(d)};

let PR={},AV={},MT={};
const metaDefault=()=>({days:{},bonus:0,chal:null,best:{}});
function loadHero(id){PR=store.get(K.prog(id),{})||{};AV={...AVD,...(store.get(K.ava(id),{})||{})};MT={...metaDefault(),...(store.get(K.meta(id),{})||{})}}
const saveP=()=>store.set(K.prog(PF.active),PR),saveA=()=>store.set(K.ava(PF.active),AV),saveM=()=>store.set(K.meta(PF.active),MT);

/* ---------- progress, xp and levels ---------- */
const pc=(id,pr=PR)=>pr[id]||{c:0,t:0};
const cnt=(id,pr=PR)=>pc(id,pr).c||0;
const nextTier=c=>TIERS.find(t=>c<t[0]);
const topTier=c=>[...TIERS].reverse().find(t=>c>=t[0]);
const tiersOf=c=>TIERS.filter(t=>c>=t[0]);
const xpOf=(pr,mt)=>Object.values(pr).reduce((s,p)=>s+(p.c||0)*10+TIERS.filter(t=>(p.c||0)>=t[0]).length*25,0)+((mt&&mt.bonus)||0);
const xp=()=>xpOf(PR,MT);
const lv=x=>{let L=1;while(x>=50*(L+1)*L)L++;return{L,base:50*L*(L-1),nxt:50*(L+1)*L}};
const TITLES=['Number Newbie','Counting Cub','Math Explorer','Problem Solver','Number Ninja','Math Whiz','Super Solver','Math Hero','Math Champion','Math Legend'];
const titleOf=L=>TITLES[Math.min(L-1,TITLES.length-1)];
const accOf=p=>{if(p.r&&p.r.length>=5)return[...p.r].filter(x=>x==='1').length/p.r.length;if(p.t>=5)return p.c/p.t;return null};
const needsWork=p=>{const a=accOf(p);return a!=null&&a<.6&&(p.c||0)<50};
const medalCounts=(pr=PR)=>TIERS.map(t=>Object.values(pr).filter(p=>(p.c||0)>=t[0]).length);
function dayStreak(mt=MT){let n=0,i=mt.days[today()]?0:1;while(mt.days[dayOffset(i)]){n++;i++}return n}
const lastGrade=(pr=PR)=>{let best=0,g=0;for(const id of ALLIDS){const p=pr[id];if(p&&p.ts>best){best=p.ts;g=SK[id].g}}return g};
function suggest(g,ex){const st=gradeSkills(g).filter(id=>id!==ex).map(id=>({id,p:pc(id)}));
  const w=st.filter(x=>needsWork(x.p)).sort((a,b)=>accOf(a.p)-accOf(b.p))[0];if(w)return{id:w.id,why:'Let’s practice this one again.'};
  const nr=st.filter(x=>x.p.c>0&&x.p.c<50).map(x=>({...x,r:x.p.c/nextTier(x.p.c)[0]})).sort((a,b)=>b.r-a.r||(b.p.ts||0)-(a.p.ts||0))[0];
  if(nr){const t=nextTier(nr.p.c);return{id:nr.id,why:`${t[0]-nr.p.c} more right answers for a ${t[2]} medal.`}}
  const nw=st.find(x=>!x.p.t);return nw?{id:nw.id,why:'A new skill to try.'}:null}

let ACX=null;
function tone(f,d,type='sine',vol=.07,w=0){if(!SET.sound)return;try{ACX=ACX||new (window.AudioContext||window.webkitAudioContext)();const t=ACX.currentTime+w,o=ACX.createOscillator(),g=ACX.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(ACX.destination);o.start(t);o.stop(t+d+.05)}catch(e){}}
const SFX={ok(){tone(660,.14);tone(990,.2,'sine',.06,.1)},no(){tone(240,.22,'triangle',.06)},medal(){[523,659,784,1047].forEach((f,i)=>tone(f,.2,'triangle',.07,i*.09))},level(){[392,523,659,784,1047,1319].forEach((f,i)=>tone(f,.24,'triangle',.07,i*.1))}};
function confetti(n=140){if(reduced())return;const c=document.getElementById('fx');if(!c)return;const x=c.getContext('2d'),W=c.width=innerWidth,H=c.height=innerHeight,cs=getComputedStyle(document.documentElement),cols=['--g1','--g2','--g3','--g4','--g5','--hi'].map(v=>cs.getPropertyValue(v).trim()||'#f5b301');
  const ps=range(1,n).map(()=>({x:W/2+R(-80,80),y:H*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*12-4,s:R(5,10),c:P(cols),r:Math.random()*6,vr:(Math.random()-.5)*.4}));let fr=0;
  (function step(){x.clearRect(0,0,W,H);ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66);x.restore()});if(++fr<110)requestAnimationFrame(step);else x.clearRect(0,0,W,H)})()}
const canSpeak=typeof window.speechSynthesis!=='undefined'&&typeof window.SpeechSynthesisUtterance!=='undefined';
function stopSpeech(){try{if(canSpeak)speechSynthesis.cancel()}catch(e){}}
function speak(t){if(!canSpeak)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=.92;u.lang='en-CA';speechSynthesis.speak(u)}catch(e){}}
function qSpeech(q){let t=q.say||speakText(q.q);if(q.kind==='mc'){const labs=q.opts.map(o=>q.optLabel&&q.optLabel[o]?q.optLabel[o]:o==='<'?'less than':o==='>'?'greater than':o==='='?'equal to':speakText(esc(o)));t+='. Choices: '+labs.join(', ')}return t}

/* ---------- practice engine ---------- */
let PS=null;
function startPractice(mode,id){const base={mode,res:[],streak:0,best:0,xp0:xp(),done:false,q:null,idx:0,ans:''};
  if(mode==='skill'){PS={...base,id,g:SK[id].g};show('practice');if(!pc(id).t)openLearn(id,true);return}
  if(mode==='speed'){PS={...base,id,g:SK[id].g,end:Date.now()+60000,score:0};show('practice');PS.iv=setInterval(tickSpeed,250);return}
  const g=lastGrade()||1,ids=gradeSkills(g),started=ids.filter(i=>pc(i).t),fresh=ids.filter(i=>!pc(i).t);let pool=[...started.filter(i=>needsWork(pc(i))),...SH(started),...fresh.slice(0,3)];if(pool.length<4)pool=[...pool,...ids.slice(0,6)];pool=[...new Set(pool)];
  const seq=range(1,10).map((_,i)=>pool[i%pool.length]);PS={...base,mode:'challenge',g,seq:SH(seq),bonusOk:!(MT.chal&&MT.chal.d===today())};show('practice')}
const curId=()=>PS.mode==='challenge'?PS.seq[PS.idx]:PS.id;
function newQ(){let q,tries=0;do{q=SK[curId()].gen();tries++}while(PS.q&&tries<6&&q.q===PS.q.q&&(q.vis||'')===(PS.q.vis||''));PS.q=q;PS.done=false;PS.hint=false;PS.ans=''}
V.practice=()=>{if(!PS)return show('hub');newQ();drawPractice();if(SET.auto)later(()=>speak(qSpeech(PS.q)),350)};
function practiceSub(){if(PS.mode==='challenge')return`Daily challenge · Grade ${PS.g}`;if(PS.mode==='speed'){const b=MT.best[PS.id]||0;return`60-second sprint · best ${b}`}const c=cnt(PS.id),nt=nextTier(c);return nt?`${c}/${nt[0]} for ${nt[2]}`:`${c} right · all medals earned`}
function roundDots(){const n=10,cur=PS.res.length;return`<div class="round" aria-label="Question ${Math.min(cur+1,n)} of ${n}">${range(0,n-1).map(i=>`<i class="${i<cur?(PS.res[i]?'ok':'no'):i===cur?'cur':''}"></i>`).join('')}</div>`}
function drawPractice(){const q=PS.q,id=curId(),s=SK[id],speed=PS.mode==='speed';
  const back=PS.mode==='challenge'?'hub':'gradeBack';
  const right=speed?`<span class="timer" id="timer">60</span>`:`<span class="streak" title="Right answers in a row">${icon('flame')}<span id="streak">${PS.streak}</span></span>`;
  app.innerHTML=`<div class="stack" style="gap:14px;${GC(PS.g)}"><header class="practice-head"><button class="icon-btn" data-a="${back}" aria-label="Back">${icon('back')}</button><div class="page-title"><h1>${PS.mode==='challenge'?s.name:s.name}</h1><p class="muted tnum" id="psub">${practiceSub()}</p></div>${right}<button class="icon-btn" data-a="sound" aria-pressed="${SET.sound}" aria-label="Sound effects">${icon(SET.sound?'speak':'mute')}</button></header>
  ${speed?`<div class="label tnum" style="text-align:center">Score <span id="score" style="font-size:1.3rem;color:var(--ink)">${PS.score}</span></div>`:roundDots()}
  <section class="sheet qcard" id="qcard"><div class="qtop"><span class="label">${speed?'Answer as many as you can':`Question ${PS.res.length+1} of 10`}</span><div class="tool-row">${canSpeak?`<button class="icon-btn" data-a="say" aria-label="Read the question aloud">${icon('speak')}</button>`:''}${speed?'':`<button class="icon-btn" data-a="hint" aria-label="Show a hint">${icon('bulb')}</button><button class="icon-btn" data-a="learn" data-v="${id}" aria-label="How it works">${icon('book')}</button>`}</div></div>
  <div id="hintbox"></div>${q.vis?`<div class="viswrap">${q.vis}</div>`:''}<div class="qtext">${q.q}</div><div id="answer">${answerArea(q)}</div><div id="fb" role="status" aria-live="polite"></div></section>
  ${!speed&&PS.mode==='skill'?`<div class="row" style="justify-content:center"><button class="chip" data-a="speed" data-v="${id}">${icon('timer')}Try a 60-second sprint</button></div>`:''}</div>`;
  const inp=document.getElementById('ansbox');if(inp&&!coarse)inp.focus()}
function answerArea(q){if(q.kind==='mc'){const n=q.opts.length,lab=o=>String(q.optLabel&&q.optLabel[o]||o),short=!!q.optHtml||q.opts.every(o=>lab(o).length<=7),long=!q.optHtml&&q.opts.some(o=>lab(o).length>11),cls=long?' one':(q.cols===3||n===3)?(short?' three':' one'):(n===2&&!short?' one':'');return`<div class="opts${cls}" role="group" aria-label="Answer choices">${q.opts.map((o,i)=>`<button class="opt ${q.optClass||''}" data-a="opt" data-v="${i}" aria-label="${esc(q.optLabel&&q.optLabel[o]?q.optLabel[o]:o)}"><span class="k">${i+1}</span>${q.optHtml&&q.optHtml[o]?q.optHtml[o]:esc(o)}</button>`).join('')}</div>`}
  return`<div class="answer"><div class="ansrow"><input id="ansbox" class="ansbox" ${coarse?'inputmode="none" readonly':'inputmode="decimal"'} autocomplete="off" aria-label="Your answer" placeholder="?">${q.unit?`<span class="unit">${esc(q.unit)}</span>`:''}</div><div class="keypad">${['7','8','9','⌫','4','5','6','go','1','2','3','0','.'].map(k=>k==='⌫'?`<button data-a="key" data-v="back" aria-label="Delete">${icon('backspace')}</button>`:k==='go'?`<button class="go" data-a="check">Check</button>`:`<button data-a="key" data-v="${k}">${k}</button>`).join('')}</div></div>`}
function keyIn(k){const i=document.getElementById('ansbox');if(!i||PS.done)return;if(k==='back')i.value=i.value.slice(0,-1);else if(i.value.length<12)i.value+=k;PS.ans=i.value}
function shake(){const c=document.getElementById('answer');if(c){c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake')}}
function answer(given,btn){if(!PS||PS.done)return;given=String(given).trim();if(!given){shake();return}PS.done=true;const q=PS.q,id=curId(),ok=isRight(given,q),x0=xp(),L0=lv(x0).L;
  const p=PR[id]||(PR[id]={c:0,t:0});p.t++;if(ok)p.c++;p.ts=Date.now();p.r=((p.r||'')+(ok?'1':'0')).slice(-10);saveP();MT.days[today()]=(MT.days[today()]||0)+1;saveM();
  PS.res.push(ok);PS.streak=ok?PS.streak+1:0;PS.best=Math.max(PS.best,PS.streak);
  const L1=lv(xp()).L,newTier=ok?TIERS.find(t=>p.c===t[0]):null;
  if(q.kind==='mc'){document.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true;if(q.opts[i]===q.a)b.classList.add('ok');else if(b===btn)b.classList.add('no')})}else{const i=document.getElementById('ansbox');i.readOnly=true;i.classList.add(ok?'ok':'no');document.querySelectorAll('.keypad button').forEach(b=>b.disabled=true)}
  const st=document.getElementById('streak');if(st)st.textContent=PS.streak;const ps=document.getElementById('psub');if(ps)ps.textContent=practiceSub();
  if(PS.mode==='speed'){if(ok){PS.score++;document.getElementById('score').textContent=PS.score;SFX.ok()}else SFX.no();

/* ---------- settings ---------- */
function openSettings(){openModal(`<div class="stack"><div class="split"><h2>Settings</h2><button class="icon-btn" data-a="close" aria-label="Close">${icon('x')}</button></div>
  <div class="toggle"><span><b>Sound effects</b><br><span class="muted">Chimes for right answers and medals</span></span><button class="switch" role="switch" aria-checked="${SET.sound}" data-a="tog" data-v="sound" aria-label="Sound effects"></button></div>
  ${canSpeak?`<div class="toggle"><span><b>Read questions aloud</b><br><span class="muted">Each new question is read out automatically</span></span><button class="switch" role="switch" aria-checked="${SET.auto}" data-a="tog" data-v="auto" aria-label="Read questions aloud"></button></div>`:''}
  <div class="row"><button class="btn soft" data-a="who">${icon('people')}Switch hero</button><button class="btn soft" data-a="parent">Grown-ups</button></div><p class="note">Number Heroes is free. Questions are made fresh each time, so practice never runs out.</p></div>`,'Settings')}

/* ---------- actions ---------- */
const A={
  hub:()=>show('hub'),who:()=>show('who'),hero:()=>show('hero'),parent:()=>show('parent'),settings:openSettings,close:closeModal,
  grade:v=>{FILTER='';show('grade',+v)},gradeBack:()=>show('grade',PS?PS.g:1),
  pick:v=>{PF.active=+v;savePF();loadHero(+v);show('hub')},
  addHero:()=>{const id=[1,2,3].find(i=>!PF.ids.includes(i));if(!id)return;PF.ids.push(id);PF.ids.sort();PF.active=id;savePF();loadHero(id);HTAB='look';show('hero')},
  del:v=>show('who',+v),delYes:v=>{const id=+v;PF.ids=PF.ids.filter(i=>i!==id);[K.prog(id),K.ava(id),K.meta(id)].forEach(k=>store.del(k));if(PF.active===id)PF.active=PF.ids[0];savePF();loadHero(PF.active);show('who')},
  skill:v=>startPractice('skill',v),speed:v=>startPractice('speed',v),challenge:()=>startPractice('challenge'),
  learn:v=>openLearn(v,false),
  opt:(v,el)=>answer(PS.q.opts[+v],el),key:v=>keyIn(v),check:()=>{const i=document.getElementById('ansbox');answer(i?i.value:'')},
  next:()=>nextQ(),finish:()=>finishRound(),newskill:()=>{const s=suggest(PS.g,PS.id);if(s)startPractice('skill',s.id);else show('grade',PS.g)},
  hint:()=>{if(PS.hint)return;PS.hint=true;document.getElementById('hintbox').innerHTML=`<div class="hint">${icon('bulb')}<span>${SK[curId()].tip}</span></div>`},
  say:()=>speak(qSpeech(PS.q)),
  sound:(v,el)=>{SET.sound=!SET.sound;saveSET();el.setAttribute('aria-pressed',SET.sound);el.innerHTML=icon(SET.sound?'speak':'mute')},
  tog:(v,el)=>{SET[v]=!SET[v];saveSET();el.setAttribute('aria-checked',SET[v])},
  htab:v=>{HTAB=v;const y=scrollY;V.hero();scrollTo(0,y)},
  setA:(v,el)=>{const k=el.dataset.k;AV[k]=['skin','hc','shirt','bg'].includes(k)?+v:v;saveA();const y=scrollY;V.hero();scrollTo(0,y)},
  gate:v=>{const g=document.getElementById('gate');if(g&&g.value.trim()===String(v)){pOK=true;pSel=PF.active;V.parent()}else{const m=document.getElementById('gatemsg');if(m)m.textContent='That is not right. Try again.'}},
  psel:v=>{pSel=+v;V.parent()},
  copyrep:()=>copyText(document.getElementById('report').value,()=>{document.getElementById('repmsg').textContent='Copied. Paste it into an email or message.'},document.getElementById('report')),
  copybk:()=>copyText(document.getElementById('bkcode').value,()=>{document.getElementById('restmsg').innerHTML='<p class="ok-text">Backup code copied. Keep it somewhere safe.</p>'},document.getElementById('bkcode')),
  restore:()=>{const o=readBackup(document.getElementById('restore').value),m=document.getElementById('restmsg');if(!o){m.innerHTML='<p class="bad-text">That code does not look right. Copy the whole code, starting with NH1.</p>';return}
    const L=lv(xpOf(o.pr,o.mt)).L,nm=o.av.name||'a hero',cur=heroName(readHero(pSel).av,pSel);window._rb=o;
    m.innerHTML=`<div class="hint">${icon('bulb')}<span>This code holds <b>${esc(nm)}</b> at Level ${L}.</span></div><div class="row"><button class="btn sm" data-a="restReplace">Replace ${cur}</button>${PF.ids.length<3?'<button class="btn soft sm" data-a="restNew">Add as a new hero</button>':''}</div>`},
  restReplace:()=>{const o=window._rb;if(!o)return;store.set(K.prog(pSel),o.pr);store.set(K.ava(pSel),o.av);store.set(K.meta(pSel),o.mt||metaDefault());if(pSel===PF.active)loadHero(pSel);pMsg='<p class="ok-text">Progress restored.</p>';V.parent()},
  restNew:()=>{const o=window._rb,id=[1,2,3].find(i=>!PF.ids.includes(i));if(!o||!id)return;store.set(K.prog(id),o.pr);store.set(K.ava(id),o.av);store.set(K.meta(id),o.mt||metaDefault());PF.ids.push(id);PF.ids.sort();savePF();pSel=id;pMsg='<p class="ok-text">Hero added.</p>';V.parent()}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const a=el.dataset.a;if(a==='mailto')return;if(A[a]){e.preventDefault();A[a](el.dataset.v,el)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('modal')){closeModal();return}
  if(VIEW!=='practice'||!PS||document.getElementById('modal'))return;const tag=(e.target.tagName||'').toLowerCase();
  if(PS.done){if((e.key==='Enter'||e.key===' ')&&tag!=='button'&&tag!=='summary'){e.preventDefault();const nb=document.getElementById('nextbtn');if(nb)nb.click()}return}
  if(PS.q.kind==='mc'){const n=parseInt(e.key,10);if(n>=1&&n<=PS.q.opts.length){e.preventDefault();const b=document.querySelectorAll('.opt')[n-1];if(b)b.click()}return}
  if(e.key==='Enter'){e.preventDefault();A.check();return}
  if(tag==='input')return;if(/^[0-9.]$/.test(e.key)){e.preventDefault();keyIn(e.key)}else if(e.key==='Backspace'){e.preventDefault();keyIn('back')}});

/* ---------- boot ---------- */
loadHero(PF.active);
show(PF.ids.length>1?'who':'hub');
</script>
</body>
</html>
