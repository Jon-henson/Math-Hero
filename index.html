<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grade 2 Math Practice</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1c2033;--mut:#6b7190;--pri:#5b5bf0;--pri2:#eceafe;--ok:#12a36b;--okbg:#e2f6ee;--bad:#e5484d;--badbg:#fde8e9;--line:#e4e6f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141f;--card:#1b1e2e;--ink:#eceefb;--mut:#9aa0c0;--pri:#8c8cff;--pri2:#2a2a52;--ok:#3ccf91;--okbg:#14352a;--bad:#ff7075;--badbg:#3d1d22;--line:#2b2f45}}
:root[data-theme="dark"]{--bg:#12141f;--card:#1b1e2e;--ink:#eceefb;--mut:#9aa0c0;--pri:#8c8cff;--pri2:#2a2a52;--ok:#3ccf91;--okbg:#14352a;--bad:#ff7075;--badbg:#3d1d22;--line:#2b2f45}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.5rem;margin:0}h2{font-size:1.05rem;margin:28px 0 10px}
small,.sub{color:var(--mut)}
.hero{background:linear-gradient(135deg,var(--pri),#9b6bff);color:#fff;border-radius:20px;padding:22px;margin-bottom:8px}
.hero h1{color:#fff}.hero p{margin:6px 0 14px;opacity:.9}
.hero .pb{background:rgba(255,255,255,.3);height:8px;border-radius:9px;overflow:hidden}.hero .pb i{background:#fff}
.list{display:grid;gap:8px}
.row{display:grid;grid-template-columns:1fr 70px 72px;gap:12px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--ink);font:inherit;cursor:pointer;transition:.15s}
.row:hover{border-color:var(--pri);transform:translateY(-1px)}
.row b{font-size:.8rem;color:var(--mut);text-align:right}
.pb{height:6px;background:var(--line);border-radius:9px;overflow:hidden}.pb i{display:block;height:100%;background:var(--pri);border-radius:9px}
.top{display:flex;gap:12px;align-items:center;margin-bottom:16px}.top>div{flex:1}.top h1{font-size:1.15rem}
.back{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:1.1rem;cursor:pointer}
.streak{background:var(--pri2);color:var(--pri);padding:6px 12px;border-radius:99px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;text-align:center}
.qt{font-size:1.3rem;margin:12px 0 20px}.qt b{font-size:1.7rem}
.v{color:var(--pri);margin:0 auto}.g{display:inline-block;border:2px dashed var(--line);border-radius:12px;padding:4px 8px;margin:4px;font-size:1.3rem}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.opt,.pri{font:inherit;font-weight:600;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.opt:hover{border-color:var(--pri)}.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.no{border-color:var(--bad);background:var(--badbg)}
.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.ans{display:flex;gap:10px;justify-content:center}
input{font:inherit;font-size:1.3rem;width:160px;text-align:center;padding:10px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
input:focus{outline:none;border-color:var(--pri)}
#fb{margin-top:18px;min-height:56px}
.sol{text-align:left;background:var(--pri2);border-radius:14px;padding:12px 14px;margin-bottom:10px;line-height:1.8}.sol summary{cursor:pointer;font-weight:600;color:var(--pri)}
.lvl{display:flex;gap:14px;align-items:center;margin-bottom:14px}.lvl p{margin:0!important}.big{width:54px;height:54px;border-radius:50%;background:#fff;color:var(--pri);display:grid;place-items:center;font-size:1.6rem;font-weight:800}
@keyframes pop{0%{transform:scale(.8);opacity:0}60%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}.fb.pop{animation:pop .5s;background:var(--pri2);color:var(--pri)}
.avw{width:min(170px,60vw);margin:0 auto 10px;border-radius:24%;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.15)}.avw svg{display:block;width:100%;height:auto}
.big{overflow:hidden;cursor:pointer}.big svg{width:100%;height:100%}
.hubhero{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px;text-align:center}.hubhero h1{cursor:pointer}
.tiers{display:flex;gap:10px;justify-content:center;margin:10px 0 14px;font-weight:600;flex-wrap:wrap}.tiers span{background:var(--pri2);padding:4px 12px;border-radius:99px}
.grades{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.gc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;text-align:center;display:grid;gap:4px;color:var(--ink);font:inherit}.gc b{font-size:2rem;color:var(--pri)}.gc.on{cursor:pointer;border:2px solid var(--pri)}.gc.off{opacity:.55}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line);cursor:pointer}.sw.on{box-shadow:0 0 0 3px var(--pri)}
.opts2{display:flex;flex-wrap:wrap;gap:8px}.chip{font:inherit;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}.chip.lk{opacity:.5;cursor:not-allowed}
h3{font-size:.95rem;margin:18px 0 8px;color:var(--mut)}
.v{max-width:100%;height:auto}
.nxt{background:linear-gradient(135deg,var(--pri2),var(--card));border:1px solid var(--line);border-radius:20px;padding:16px;margin:16px 0;display:grid;gap:4px;text-align:left}.nxt b{font-size:1.1rem}.nxt span{color:var(--mut);font-size:.9rem;margin-bottom:8px}.nxt .pri{justify-self:start;padding:10px 20px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}.st{background:var(--pri2);border-radius:14px;padding:12px;text-align:center;font-size:.85rem;color:var(--mut)}.st b{display:block;font-size:1.4rem;color:var(--pri)}
.li{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:6px;font-size:.9rem;text-align:left}.li span:last-child{color:var(--mut);white-space:nowrap}
.rp{width:100%;height:230px;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px;resize:vertical}
.pcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pc{position:relative;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px;text-align:center;display:grid;gap:6px;color:var(--ink);font:inherit}.pc.on{border-color:var(--pri)}
.pcb{background:none;border:0;color:var(--ink);font:inherit;cursor:pointer;display:grid;gap:4px;justify-items:center}
.pav{display:block;width:96px;height:96px;border-radius:24%;overflow:hidden}.pav svg{display:block;width:100%;height:100%}
.pcd{position:absolute;top:8px;right:8px;background:none;border:0;font-size:1rem;cursor:pointer;opacity:.6}
.pdel{font-size:.85rem}.pdel button{font:inherit;margin:0 4px;padding:2px 10px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.pc.add{cursor:pointer;border-style:dashed;align-content:center}.plus{font-size:2.4rem;color:var(--pri)}
.sw.lk{opacity:.45;font-size:.75rem;display:inline-grid;place-items:center;cursor:not-allowed;background-blend-mode:luminosity}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}.bt{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center;display:grid;gap:4px}.bt span{font-size:1.4rem}.bt small{line-height:1.25}
.fb{border-radius:14px;padding:12px;font-weight:600;margin-bottom:10px}.fb.ok{background:var(--okbg);color:var(--ok)}.fb.no{background:var(--badbg);color:var(--bad)}
</style></head><body><div id="app"></div>
<script>
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,P=a=>a[R(0,a.length-1)];
const SH=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const num=(q,a,x)=>({q,a:String(a),...x});
const mc=(q,a,ds,x)=>({q,a:String(a),mc:SH([String(a),...[...new Set(ds.map(String))].filter(d=>d!=a).slice(0,3)]),...x});
const nm=['Mia','Leo','Ava','Sam','Zoe','Noah'],it=['stickers','marbles','books','cards','shells'];
const esc=s=>String(s).replace(/</g,'&lt;');
const clock=(h,m)=>{const a=(v,l,w)=>{const t=v*Math.PI/180;return `<line x1="60" y1="60" x2="${60+l*Math.sin(t)}" y2="${60-l*Math.cos(t)}" stroke="currentColor" stroke-width="${w}" stroke-linecap="round"/>`};let t='';for(let i=1;i<=12;i++){const r=i*Math.PI/6;t+=`<text x="${60+43*Math.sin(r)}" y="${64-43*Math.cos(r)}" font-size="11" text-anchor="middle" fill="currentColor">${i}</text>`}return `<svg class="v" viewBox="0 0 120 120" width="170"><circle cx="60" cy="60" r="56" fill="none" stroke="currentColor" stroke-width="3"/>${t}${a(h%12*30+m/2,28,4)}${a(m*6,40,2.5)}</svg>`};
const bar=(n,k)=>`<svg class="v" viewBox="0 0 ${n*50} 40" width="${n*62}">`+[...Array(n)].map((_,i)=>`<rect x="${i*50+2}" y="2" width="46" height="36" rx="6" fill="${i<k?'currentColor':'none'}" stroke="currentColor" stroke-width="2"/>`).join('')+'</svg>';
const tm=(h,m)=>h+':'+String(m).padStart(2,'0');
function pair(f){for(;;){const a=R(10,89),b=R(10,89-0);if(f(a,b))return[a,b]}}
const G={
skip(){const s=P([2,5,10]),st=s*R(0,s==2?20:8),i=R(1,3),a=[0,1,2,3,4].map(x=>st+x*s);return num(`Fill in the missing number:<br><b>${a.map((x,j)=>j==i?'__':x).join(', ')}</b>`,a[i])},
cmp(){const a=R(100,999),b=Math.random()<.15?a:R(100,999);return{q:`Which sign goes in the circle?<br><b>${a} ○ ${b}</b>`,a:a<b?'<':a>b?'>':'=',mc:['<','=','>']}},
eo(){const n=R(1,99);return{q:`Is <b>${n}</b> even or odd?`,a:n%2?'odd':'even',mc:['even','odd']}},
add20(){const a=R(2,12),b=R(2,20-a);return num(`<b>${a} + ${b} = ?</b>`,a+b)},
dbl(){const n=R(1,10);return num(`<b>${n} + ${n} = ?</b>`,2*n)},
add2(){const[a,b]=pair((a,b)=>a%10+b%10<10&&a+b<100);return num(`<b>${a} + ${b} = ?</b>`,a+b)},
add2r(){const[a,b]=pair((a,b)=>a%10+b%10>=10&&a+b<100);return num(`<b>${a} + ${b} = ?</b>`,a+b)},
add3(){const a=R(100,800),b=R(100,999-a);return num(`<b>${a} + ${b} = ?</b>`,a+b)},
sub20(){const a=R(5,20),b=R(1,a);return num(`<b>${a} − ${b} = ?</b>`,a-b)},
sub2(){const[a,b]=pair((a,b)=>a>b&&a%10>=b%10);return num(`<b>${a} − ${b} = ?</b>`,a-b)},
sub2r(){const[a,b]=pair((a,b)=>a>b&&a%10<b%10);return num(`<b>${a} − ${b} = ?</b>`,a-b)},
sub3(){const a=R(200,999),b=R(100,a-1);return num(`<b>${a} − ${b} = ?</b>`,a-b)},
word(){const n=P(nm),i=P(it),a=R(30,90);if(Math.random()<.5){const b=R(10,99-a);return num(`${n} has ${a} ${i}. ${n} gets ${b} more. How many ${i} now?`,a+b)}const b=R(10,a-5);return num(`${n} has ${a} ${i}. ${n} gives away ${b}. How many ${i} are left?`,a-b)},
pv(){let d;do{d=[R(1,9),R(1,9),R(1,9)]}while(new Set(d).size<3);const p=R(0,2),n=d.join(''),v=d[p]*[100,10,1][p];return num(`What is the value of the digit <b>${d[p]}</b> in <b>${n}</b>?`,v)},
exp(){const a=R(1,9),b=R(1,9),c=R(0,9);return num(`<b>${a*100} + ${b*10} + ${c} = ?</b>`,a*100+b*10+c)},
r10(){const n=R(11,99);return num(`Round <b>${n}</b> to the nearest ten.`,Math.round(n/10)*10)},
r100(){const n=R(101,999);return num(`Round <b>${n}</b> to the nearest hundred.`,Math.round(n/100)*100)},
coins(){const q=R(0,3),d=R(0,4),n=R(0,3);if(q+d+n<2)return G.coins();const t=[[q,'quarter'],[d,'dime'],[n,'nickel']].filter(x=>x[0]).map(x=>`${x[0]} ${x[1]}${x[0]>1?'s':''}`).join(', ');return num(`Count the money: ${t}.<br>How many cents in all? <small>(quarter = 25, dime = 10, nickel = 5)</small>`,q*25+d*10+n*5)},
clk(){const h=R(1,12),m=R(0,11)*5,a=tm(h,m);return mc('What time is it?',a,[tm(h%12+1,m),tm(h,(m+30)%60),tm((h+10)%12+1,m),tm(m/5||12,h*5%60)],{v:clock(h,m)})},
sides(){const s=P([[3,'triangle'],[4,'quadrilateral'],[5,'pentagon'],[6,'hexagon'],[8,'octagon']]);return mc(`Which shape has <b>${s[0]}</b> sides?`,s[1],['triangle','quadrilateral','pentagon','hexagon','octagon'])},
peri(){const l=R(2,15),w=R(2,12);return num(`A rectangle is ${l} cm long and ${w} cm wide.<br>What is its perimeter (in cm)?`,2*(l+w))},
frac(){const n=P([2,3,4]),k=R(1,n-1);return mc('What fraction is shaded?',k+'/'+n,[(n-k)+'/'+n,k+'/'+(n+1),(k+1)+'/'+n,'1/'+(n-1||2),'1/'+n],{v:bar(n,k)})},
grp(){const g=R(2,6),s=R(2,6),e=P(['🍎','⭐','🐟','🍪']);return num(`${g} groups of ${s}. How many in all?<div>${Array(g).fill(`<span class="g">${e.repeat(s)}</span>`).join('')}</div>`,g*s)},
mul(){const a=P([2,3,4,5,10]),b=R(1,10);return num(`<b>${a} × ${b} = ?</b>`,a*b)},
div(){const b=P([2,3,4,5,10]),q=R(1,10);return num(`<b>${b*q} ÷ ${b} = ?</b>`,q)}
};
const S=[
['Counting & comparing','🔢',[['skip','Skip-counting sequences'],['cmp','Compare numbers up to 1000'],['eo','Even or odd']]],
['Addition','➕',[['add20','Add one-digit numbers (sums to 20)'],['dbl','Add doubles'],['add2','Add two-digit numbers, no regrouping'],['add2r','Add two-digit numbers, with regrouping'],['add3','Add three-digit numbers']]],
['Subtraction','➖',[['sub20','Subtract within 20'],['sub2','Subtract two-digit numbers, no regrouping'],['sub2r','Subtract two-digit numbers, with regrouping'],['sub3','Subtract three-digit numbers'],['word','Addition & subtraction word problems']]],
['Place value & rounding','🏷️',[['pv','Value of a digit'],['exp','Expanded form'],['r10','Round to the nearest ten'],['r100','Round to the nearest hundred']]],
['Money & time','🪙',[['coins','Count coins'],['clk','Read an analogue clock']]],
['Shapes & measurement','📐',[['sides','Name polygons by sides'],['peri','Perimeter of rectangles']]],
['Fractions','🍕',[['frac','Identify the shaded fraction']]],
['Multiplication & division','✖️',[['grp','Equal groups'],['mul','Multiplication facts (2, 3, 4, 5, 10)'],['div','Division facts (2, 3, 4, 5, 10)']]]
];
const app=document.getElementById('app');
let PR={};try{PR=JSON.parse(localStorage.getItem('g2math')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('g2math'+SUF,JSON.stringify(PR))}catch(e){}};
const cnt=id=>(PR[id]||{}).c||0;
const B=[[10,'🥉','Bronze'],[25,'🥈','Silver'],[50,'🥇','Gold']],nb=c=>B.find(b=>c<b[0]),hb=c=>[...B].reverse().find(b=>c>=b[0]);
const T=['Number Newbie','Counting Cub','Math Explorer','Problem Solver','Number Ninja','Math Whiz','Super Solver','Math Hero','Math Champion','Math Legend'];
const xp=()=>Object.values(PR).reduce((s,p)=>s+p.c*10+B.filter(b=>p.c>=b[0]).length*25,0);
const lv=x=>{let L=1;while(x>=50*(L+1)*L)L++;return{L,base:50*L*(L-1),nxt:50*(L+1)*L}};
const meta=()=>{const c=cnt(cur[0]),x=nb(c);return 'Lv '+lv(xp()).L+' · '+(x?c+'/'+x[0]+' correct to earn '+x[1]:'🏅 All badges earned!')};
const sp=(a,b,add)=>{const ps=[Math.floor(b/100)*100,Math.floor(b%100/10)*10,b%10].filter(x=>x);let r=a;const s=ps.map(p=>{const n=add?r+p:r-p,l=`${r} ${add?'+':'−'} ${p} = <b>${n}</b>`;r=n;return l});return `Break ${b} into ${ps.join(' + ')} and ${add?'add':'subtract'} one part at a time:<br>`+s.join('<br>')};
const cn=(a,b,add)=>`Start at ${a} and count ${add?'up':'back'} ${b}:<br>${a} ${add?'+':'−'} ${b} = <b>${add?a+b:a-b}</b>`;
const SOL={
skip:(n,q)=>{const s=Math.min(...n.slice(1).map((x,i)=>Math.abs(x-n[i])));return `The numbers go up by ${s} each time.<br>${q.a-s} + ${s} = <b>${q.a}</b>`},
cmp:(n,q)=>{const[a,b]=n;if(a==b)return 'Both numbers are the same, so use <b>=</b>.';const A=String(a),Bs=String(b),i=[...A].findIndex((d,j)=>d!=Bs[j]);return `Compare the <b>${['hundreds','tens','ones'][i]}</b> place first: ${A[i]} and ${Bs[i]}.<br>${A[i]>Bs[i]?a:b} is bigger, so ${a} <b>${q.a}</b> ${b}.`},
eo:n=>`Look at the ones digit: <b>${n[0]%10}</b>.<br>Numbers ending in 0, 2, 4, 6 or 8 are even. Numbers ending in 1, 3, 5, 7 or 9 are odd.`,
add20:n=>cn(n[0],n[1],1),dbl:n=>`Doubles means adding a number to itself. Count by ${n[0]}s two times: ${n[0]}, ${2*n[0]}.<br>${n[0]} + ${n[0]} = <b>${2*n[0]}</b>`,
add2:n=>sp(n[0],n[1],1),add2r:n=>sp(n[0],n[1],1),add3:n=>sp(n[0],n[1],1),
sub20:n=>cn(n[0],n[1],0),sub2:n=>sp(n[0],n[1],0),sub2r:n=>sp(n[0],n[1],0),sub3:n=>sp(n[0],n[1],0),
word:(n,q)=>{const ad=/more/.test(q.q);return `${ad?'"More" means we add':'"Gives away" means we subtract'}:<br>${n[0]} ${ad?'+':'−'} ${n[1]} = <b>${q.a}</b>`},
pv:n=>{const i=String(n[1]).indexOf(n[0]),pl=['hundreds','tens','ones'][i],v=[100,10,1][i];return `The digit ${n[0]} is in the <b>${pl}</b> place of ${n[1]}.<br>${n[0]} ${pl} = ${n[0]} × ${v} = <b>${n[0]*v}</b>`},
exp:n=>`That is ${n[0]/100} hundreds, ${n[1]/10} tens and ${n[2]} ones.<br>${n[0]} + ${n[1]} + ${n[2]} = <b>${n[0]+n[1]+n[2]}</b>`,
r10:(n,q)=>{const o=n[0]%10;return `Look at the ones digit: <b>${o}</b>.<br>${o>=5?'It is 5 or more, so round <b>up</b>':'It is less than 5, so round <b>down</b>'} to <b>${q.a}</b>.`},
r100:(n,q)=>{const t=Math.floor(n[0]%100/10);return `Look at the tens digit: <b>${t}</b>.<br>${t>=5?'It is 5 or more, so round <b>up</b>':'It is less than 5, so round <b>down</b>'} to <b>${q.a}</b>.`},
coins:(n,q)=>{const t=q.q.replace(/<small.*$/,''),g=(w,v)=>{const m=t.match(new RegExp('(\\d+) '+w));return m?[+m[1],v,w]:0},p=[g('quarter',25),g('dime',10),g('nickel',5)].filter(Boolean);return p.map(x=>`${x[0]} ${x[2]}${x[0]>1?'s':''}: ${x[0]} × ${x[1]} = ${x[0]*x[1]}¢`).join('<br>')+`<br>Add them up: ${p.map(x=>x[0]*x[1]).join(' + ')} = <b>${q.a}¢</b>`},
clk:(n,q)=>{const[h,m]=q.a.split(':').map(Number);return `The short hand points to ${h}, so the hour is <b>${h}</b>.<br>${m?`The long hand points to ${m/5}. Count by 5s: <b>${m}</b> minutes.`:'The long hand points to 12, so it is exactly on the hour.'}<br>The time is <b>${q.a}</b>.`},
sides:(n,q)=>`Count the sides. A <b>${q.a}</b> has ${n[0]} sides.`,

app.innerHTML=`<header class='top'><button class='back' onclick='hub()' aria-label='Home'>←</button><div><h1>My Hero</h1><small>Level ${Lv} · ${T[Math.min(Lv-1,9)]}</small></div></header><div class='card'><div class='avw'>${av(170)}</div><input id='nm' maxlength='14' placeholder='Name your hero' value='${escA(AV.name)}' style='width:100%;max-width:280px' oninput='AV.name=this.value;saveA()' aria-label='Hero name'></div><h2>🏅 My badges</h2><div class='tiers'>${B.map((b,i)=>`<span>${b[1]} ${b[2]} ${tr[i]}</span>`).join('')}</div><div class='shelf'>${shelf}</div><h2>🎨 Customise</h2><small>Level up to unlock more items!</small>${sec('Skin',sw('skin',SK,LK.skin))}${sec('Hair style',ch('style'))}${sec('Hair colour',sw('hc',HC,LK.hc))}${sec('Expression',ch('face'))}${sec('Face extras',ch('fx'))}${sec('Shirt colour',sw('shirt',SC,LK.shirt))}${sec('Outfit',ch('outfit'))}${sec('Hat',ch('hat'))}${sec('Glasses',ch('eye'))}${sec('Extras',ch('ext'))}${sec('Pet buddy',ch('pet'))}${sec('Background',sw('bg',BG,LK.bg))}`}
function home(g){if(g)gr=g;let d=0,t=0,bd=0;const body=SG[gr].map(([c,e,ks])=>`<section><h2>${e} ${c}</h2><div class="list">${ks.map(([id,n])=>{const c=cnt(id),x=nb(c),h=hb(c);t++;if(c>=10)d++;bd+=B.filter(b=>c>=b[0]).length;return `<button class="row" onclick="go('${id}')"><span>${n}</span><span class="pb"><i style="width:${x?c/x[0]*100:100}%"></i></span><b>${h?h[1]:''} ${x?c+'/'+x[0]:'✓'}</b></button>`}).join('')}</div></section>`).join('');
const X=xp(),V=lv(X);app.innerHTML=`<button class="back" onclick="hub()" aria-label="Home">←</button><div class="hero" style="margin-top:12px"><div class="lvl"><span class="big" onclick="avPage();scrollTo(0,0)">${av(54)}</span><div><h1>${T[Math.min(V.L-1,9)]}</h1><p>Grade ${gr} · Level ${V.L} · ${X} XP</p></div></div><div class="pb"><i style="width:${(X-V.base)/(V.nxt-V.base)*100}%"></i></div><p style="margin:8px 0 0;font-size:.9rem">${V.nxt-X} XP to Level ${V.L+1} · 🏅 ${bd} badges · ${d}/${t} skills mastered</p></div>${nxtCard(sg(gr),gr)}${body}`;scrollTo(0,0)}
function go(id){cur=ALL().find(k=>k[0]==id);gr=+cur[2];streak=0;next()}
function next(){q=G[cur[0]]();done=false;q.s=SOL[cur[0]](q.q.replace(/<[^>]*>/g,' ').match(/\d+/g)?.map(Number)||[],q);
app.innerHTML=`<header class="top"><button class="back" onclick="home()" aria-label="Back">←</button><div><h1>${cur[1]}</h1><small id="meta">${meta()}</small></div><span class="streak" id="st">🔥 ${streak}</span></header><div class="card">${q.v||''}<p class="qt">${q.q}</p>${q.mc?`<div class="opts">${q.mc.map(o=>`<button class="opt" data-v="${o}" onclick="ans(this.dataset.v,this)">${esc(o)}</button>`).join('')}</div>`:`<div class="ans"><input id="inp" inputmode="decimal" autocomplete="off" aria-label="Your answer"><button class="pri" onclick="ans(document.getElementById('inp').value)">Check</button></div>`}<div id="fb"></div></div>`;
const i=document.getElementById('inp');if(i)i.focus()}
function ans(v,btn){if(done)return;v=String(v).replace(/[\s,]/g,'');if(!v)return;done=true;const ok=v==String(q.a).replace(/[\s,]/g,''),p=PR[cur[0]]||(PR[cur[0]]={c:0,t:0});const x0=xp();p.ts=Date.now();p.t++;if(ok)p.c++;save();streak=ok?streak+1:0;
document.getElementById('st').textContent='🔥 '+streak;const c=cnt(cur[0]);document.getElementById('meta').textContent=meta();
document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.dataset.v==q.a)b.classList.add('ok');else if(b===btn)b.classList.add('no')});
const i=document.getElementById('inp');if(i)i.disabled=true;
let ex='';if(ok){const g=B.find(b=>p.c==b[0]);if(g)ex+=`<div class="fb pop">${g[1]} New ${g[2]} badge for ${cur[1]}! +25 XP</div><button class='opt' style='margin-bottom:10px;width:100%' onclick='nextSkill()'>🎯 Try a new skill</button>`;const l0=lv(x0).L,l1=lv(xp()).L;if(l1>l0)ex+=`<div class="fb pop">⬆️ Level up! You are now Level ${l1}: ${T[Math.min(l1-1,9)]}${unl(l1)?`<br>🎁 ${unl(l1)} new hero items unlocked!`:''}</div>`}
document.getElementById('fb').innerHTML=`<div class="fb ${ok?'ok':'no'}">${ok?'✅ Correct! +10 XP':'Not quite. The answer is '+esc(q.a)}</div>${ex}${ok?`<details class="sol"><summary>See the steps</summary>${q.s}</details>`:`<div class="sol"><b>How to solve it</b><br>${q.s}</div>`}<button class="pri" onclick="next()">Next question →</button>`}
addEventListener('keydown',e=>{if(e.key!=='Enter'||!cur||!document.getElementById('fb'))return;if(done)next();else{const i=document.getElementById('inp');if(i)ans(i.value)}});
(PF.ids.length>1?who:hub)();
</script></body></html>
