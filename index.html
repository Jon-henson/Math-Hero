<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Number Heroes: free, unlimited math practice for Grades 1 to 5 with worked solutions, medals, levels and customizable heroes.">
<meta name="theme-color" content="#2a55d4">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' rx='8' fill='%232a55d4'/%3E%3Cpath d='M16 7.5l2.4 5 5.4.8-3.9 3.8.9 5.4-4.8-2.6-4.8 2.6.9-5.4-3.9-3.8 5.4-.8Z' fill='%23ffd23f'/%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Number Heroes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Baloo+2:wght@500;600;700;800&display=swap">
<style>
/* Layout: one exercise-book column on graph paper; each grade wears its own crayon colour. */
:root{
  --paper:#f5f7fb; --sheet:#ffffff; --grid:#e3e9f4; --ink:#1b2236; --muted:#566079; --line:#d8dfeb; --line2:#c5cede;
  --accent:#2a55d4; --accent-ink:#ffffff; --accent-soft:#e7edfc; --accent-deep:#1b3fa8;
  --hi:#ffd23f; --hi-ink:#3b2d00; --hi-soft:#fff3c4;
  --ok:#13804f; --ok-soft:#dff3e8; --bad:#c93434; --bad-soft:#fde6e6; --margin:#f2a0a0;
  --g1:#e8613f; --g2:#e39613; --g3:#23935f; --g4:#2a75cc; --g5:#8253cc;
  --g1s:#fde9e3; --g2s:#fdf0d8; --g3s:#dcf2e6; --g4s:#ddebfa; --g5s:#ece3f9;
  --bronze:#c47a3c; --silver:#9aa5b6; --gold:#e1a10f;
  --font-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif;
  --r-lg:22px; --r:16px; --r-sm:11px;
  --lift:0 1px 0 rgba(27,34,54,.05),0 10px 24px -16px rgba(27,34,54,.35);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#132019; --sheet:#1a2a22; --grid:#1e2f26; --ink:#eef4ee; --muted:#a6b8ad; --line:#2b3f34; --line2:#3a5244;
  --accent:#8eaeff; --accent-ink:#0d1633; --accent-soft:#22314f; --accent-deep:#b6caff;
  --hi:#ffd95c; --hi-ink:#2a1f00; --hi-soft:#3a3318;
  --ok:#5fd49e; --ok-soft:#163a2a; --bad:#ff8f86; --bad-soft:#41211f; --margin:#7a4545;
  --g1:#ff8a6b; --g2:#ffbb4a; --g3:#5fd49e; --g4:#79b3ff; --g5:#bb95ff;
  --g1s:#3a2520; --g2s:#3a2f18; --g3s:#173a2a; --g4s:#1c2e46; --g5s:#2d2442;
  --bronze:#e0995c; --silver:#c2cbd8; --gold:#ffc53d;
  --lift:0 1px 0 rgba(0,0,0,.2),0 12px 28px -16px rgba(0,0,0,.7); color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#132019; --sheet:#1a2a22; --grid:#1e2f26; --ink:#eef4ee; --muted:#a6b8ad; --line:#2b3f34; --line2:#3a5244;
  --accent:#8eaeff; --accent-ink:#0d1633; --accent-soft:#22314f; --accent-deep:#b6caff;
  --hi:#ffd95c; --hi-ink:#2a1f00; --hi-soft:#3a3318;
  --ok:#5fd49e; --ok-soft:#163a2a; --bad:#ff8f86; --bad-soft:#41211f; --margin:#7a4545;
  --g1:#ff8a6b; --g2:#ffbb4a; --g3:#5fd49e; --g4:#79b3ff; --g5:#bb95ff;
  --g1s:#3a2520; --g2s:#3a2f18; --g3s:#173a2a; --g4s:#1c2e46; --g5s:#2d2442;
  --bronze:#e0995c; --silver:#c2cbd8; --gold:#ffc53d;
  --lift:0 1px 0 rgba(0,0,0,.2),0 12px 28px -16px rgba(0,0,0,.7); color-scheme:dark }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background-color:var(--paper);color:var(--ink);font:17px/1.55 var(--font-body);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;background-attachment:fixed;min-height:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--font-display);line-height:1.15;margin:0;text-wrap:balance;font-weight:700}
h1{font-size:1.75rem}h2{font-size:1.3rem}h3{font-size:1.05rem}
p{margin:0}
.muted{color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#app{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 56px;display:grid;gap:18px}
.bar-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:48px}
.bar-top .grow{flex:1;min-width:0}
.mark{display:flex;align-items:center;gap:9px;font-family:var(--font-display);font-weight:800;font-size:1.3rem;letter-spacing:-.01em;background:none;border:0;padding:4px 2px}
.mark svg{width:30px;height:30px;flex:none}
.page-title{display:grid;gap:2px;min-width:0}
.page-title h1{font-size:1.45rem}
.page-title .muted{font-size:.92rem}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:var(--r);padding:12px 20px;font-family:var(--font-display);font-weight:700;font-size:1.08rem;line-height:1.1;background:var(--accent);color:var(--accent-ink);box-shadow:0 3px 0 var(--accent-deep);transition:transform .08s,box-shadow .08s;min-height:48px;text-decoration:none}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--accent-deep)}
.btn.soft{background:var(--sheet);color:var(--ink);box-shadow:0 0 0 1.5px var(--line2) inset,0 3px 0 var(--line2)}
.btn.soft:active{box-shadow:0 0 0 1.5px var(--line2) inset,0 1px 0 var(--line2)}
.btn.hi{background:var(--hi);color:var(--hi-ink);box-shadow:0 3px 0 color-mix(in srgb,var(--hi) 60%,#000)}
.btn.sm{min-height:40px;padding:8px 14px;font-size:.98rem}
.btn.wide{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{width:46px;height:46px;flex:none;border-radius:14px;border:1.5px solid var(--line2);background:var(--sheet);display:grid;place-items:center;padding:0;box-shadow:0 2px 0 var(--line2)}
.icon-btn svg{width:22px;height:22px}
.icon-btn[aria-pressed="false"]{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line2);background:var(--sheet);border-radius:999px;padding:7px 14px;font-weight:700;font-size:.93rem;min-height:40px}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip svg{width:18px;height:18px}

/* surfaces */
.sheet{background:var(--sheet);border:1.5px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--lift)}
.pad{padding:20px}
.stack{display:grid;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.split{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.label{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.meter{height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .5s}
.meter.hi i{background:var(--hi)}

/* hub */
.hero-card{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.hero-card .who{display:grid;gap:8px;min-width:0}
.hero-card h2{font-size:1.6rem;overflow-wrap:anywhere}
.ava{border-radius:26%;overflow:hidden;display:block;flex:none;background:var(--line);border:none;padding:0}
.ava svg{display:block;width:100%;height:100%}
.level-pill{display:inline-flex;align-items:center;gap:6px;background:var(--hi-soft);color:var(--ink);border-radius:999px;padding:3px 12px 3px 4px;font-weight:700;font-size:.92rem;width:max-content}
.level-pill b{display:grid;place-items:center;min-width:28px;height:28px;border-radius:999px;background:var(--hi);color:var(--hi-ink);font-family:var(--font-display);font-size:1rem;padding:0 6px}
.medal-counts{display:flex;gap:14px;flex-wrap:wrap;font-weight:700}
.medal-counts span{display:inline-flex;align-items:center;gap:5px}
.medal-counts svg{width:22px;height:22px}
.daycount{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.daycount svg{width:20px;height:20px}

.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.task{display:grid;gap:10px;padding:18px;align-content:start}
.task .split h3{font-size:1.15rem}
.task p{color:var(--muted)}
.task.today{background:var(--hi-soft);border-color:color-mix(in srgb,var(--hi) 55%,var(--line))}
.done-tag{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--ok)}
.done-tag svg{width:20px;height:20px}

.grades{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media (max-width:560px){.grades{grid-template-columns:repeat(2,1fr)}.grades .gtab:last-child{grid-column:span 2}}
.gtab{position:relative;display:grid;gap:4px;justify-items:start;text-align:left;padding:14px 14px 14px;border-radius:var(--r-lg);border:1.5px solid var(--line);background:var(--sheet);box-shadow:var(--lift);overflow:hidden;min-width:0}
.gtab::before{content:"";position:absolute;inset:0 0 auto 0;height:7px;background:var(--gc)}
.gtab .num{font-family:var(--font-display);font-weight:800;font-size:2.6rem;line-height:1;color:var(--gc);margin-top:6px}
.gtab .nm{font-weight:700}
.gtab .meter{height:8px;width:100%;margin-top:4px}
.gtab .meter i{background:var(--gc)}
.gtab small{color:var(--muted);font-size:.82rem}
.gtab.last{outline:2.5px solid var(--gc);outline-offset:-2.5px}

/* grade page */
.gband{border-radius:var(--r-lg);padding:20px;background:var(--gs);border:1.5px solid color-mix(in srgb,var(--gc) 35%,var(--line));display:grid;gap:12px}
.gband .big{font-family:var(--font-display);font-weight:800;color:var(--gc);font-size:3rem;line-height:.9}
.gband .meter i{background:var(--gc)}
.search{display:flex;align-items:center;gap:8px;background:var(--sheet);border:1.5px solid var(--line2);border-radius:14px;padding:0 12px;min-height:48px}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;font-size:1rem;padding:10px 0}
.search svg{width:20px;height:20px;color:var(--muted);flex:none}
.topic{display:grid;gap:8px}
.topic-h{display:flex;align-items:center;gap:10px;padding:0 4px}
.topic-h svg{width:26px;height:26px;color:var(--gc);flex:none}
.topic-h h2{font-size:1.2rem}
.topic-h .muted{font-size:.88rem;margin-left:auto;white-space:nowrap}
.skills{display:grid;gap:8px}
.skill{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--sheet);border:1.5px solid var(--line);border-radius:var(--r);padding:10px 12px;min-height:64px;transition:border-color .15s,transform .15s}
.skill:hover{border-color:var(--gc,var(--accent));transform:translateY(-1px)}
.skill .nm{font-weight:700;line-height:1.3;min-width:0}
.skill .sub{font-size:.85rem;color:var(--muted)}
.skill .medals{display:flex;gap:2px}
.skill .medals svg{width:22px;height:22px}
.ring{width:44px;height:44px;display:block}
.ring .trk{fill:none;stroke:var(--line);stroke-width:5}
.ring .val{fill:none;stroke:var(--gc,var(--accent));stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .5s}
.ring text{font:700 12px var(--font-body);fill:var(--ink)}
.empty{padding:22px;text-align:center;color:var(--muted)}

/* practice */
.practice-head{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center}
.practice-head .page-title h1{font-size:1.2rem}
.round{display:flex;gap:6px;align-items:center}
.round i{width:100%;height:10px;border-radius:99px;background:var(--line);flex:1}
.round i.ok{background:var(--ok)}.round i.no{background:var(--bad)}.round i.cur{background:var(--line2);box-shadow:0 0 0 2px var(--accent) inset}
.streak{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-family:var(--font-display);font-size:1.1rem;padding:0 10px;height:46px;border-radius:14px;background:var(--hi-soft)}
.streak svg{width:20px;height:20px}
.qcard{position:relative;padding:22px 22px 24px 40px;display:grid;gap:18px;overflow:hidden}
.qcard::before{content:"";position:absolute;top:0;bottom:0;left:24px;width:2px;background:var(--margin);opacity:.7}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.qtext{font-size:1.32rem;line-height:1.5;overflow-wrap:anywhere}
.qtext b{font-size:1.15em}
.qtext .big{font-family:var(--font-body);font-weight:700;font-size:1.9rem;letter-spacing:.01em;display:block;margin-top:4px;font-variant-numeric:tabular-nums}
.qtext small{font-size:.8em;color:var(--muted);display:block;margin-top:4px}
.vis{display:block;max-width:100%;height:auto;margin:0 auto}
.viswrap{display:grid;place-items:center;overflow-x:auto}
.emo{font-size:1.9rem;line-height:1.35;letter-spacing:.06em;display:block}
.emo-grid{display:grid;grid-template-columns:repeat(5,auto);justify-content:center;gap:2px 8px;font-size:1.9rem;line-height:1.3}
.emo-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.emo-row .lab{font-weight:700;min-width:60px;font-size:1rem}
.pgraph{display:grid;gap:6px;justify-content:center}
.pgraph .emo-row span:last-child{font-size:1.6rem;letter-spacing:.08em}
.stem{border-collapse:collapse;margin:0 auto;font-size:1.25rem;font-variant-numeric:tabular-nums}
.stem th,.stem td{padding:6px 16px;text-align:left}
.stem th{font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.stem td:first-child,.stem th:first-child{border-right:2px solid var(--ink);text-align:right;font-weight:700}
.io{border-collapse:collapse;margin:0 auto;font-size:1.25rem;font-variant-numeric:tabular-nums}
.io th,.io td{border:1.5px solid var(--line2);padding:8px 22px;text-align:center}
.io th{background:var(--accent-soft);font-size:1rem}

.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.opts.three{grid-template-columns:repeat(3,1fr)}
.opts.one{grid-template-columns:minmax(0,1fr)}
.opt{position:relative;border:2px solid var(--line2);background:var(--sheet);border-radius:var(--r);padding:14px 12px 14px 42px;min-height:62px;font-weight:700;font-size:1.25rem;text-align:left;box-shadow:0 3px 0 var(--line2);transition:transform .08s,border-color .15s;overflow-wrap:break-word;min-width:0}
.opt .k{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:7px;background:var(--line);color:var(--muted);font-size:.78rem;display:grid;place-items:center;font-family:var(--font-body)}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt:active:not([disabled]){transform:translateY(2px);box-shadow:0 1px 0 var(--line2)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);box-shadow:0 3px 0 var(--ok)}
.opt.no{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 3px 0 var(--bad)}
.opt[disabled]{cursor:default}
.opt.sym{font-size:1.9rem;text-align:center;padding-left:12px}
.opt.sym .k{display:none}
.opt.emoji{font-size:2rem;text-align:center;padding-left:12px}
.opt.emoji .k{display:none}
.answer{display:grid;gap:12px;justify-items:center}
.ansrow{display:flex;gap:10px;justify-content:center;width:100%;max-width:420px}
.ansbox{flex:1;min-width:0;font:700 1.8rem var(--font-body);text-align:center;padding:8px 12px;border-radius:var(--r);border:2.5px solid var(--line2);background:var(--paper);color:var(--ink);min-height:62px;font-variant-numeric:tabular-nums}
.ansbox:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.ansbox.ok{border-color:var(--ok);background:var(--ok-soft)}.ansbox.no{border-color:var(--bad);background:var(--bad-soft)}
.unit{align-self:center;font-weight:700;color:var(--muted);font-size:1.1rem}
.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:420px}
.keypad button{min-height:54px;border-radius:14px;border:1.5px solid var(--line2);background:var(--sheet);font:700 1.4rem var(--font-body);box-shadow:0 3px 0 var(--line2)}
.keypad button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line2)}
.keypad .go{grid-row:span 2;background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 3px 0 var(--accent-deep);font-family:var(--font-display);font-size:1.15rem}
.keypad svg{width:24px;height:24px}
.feedback{display:grid;gap:12px;animation:rise .25s ease-out}
.verdict{display:flex;align-items:center;gap:12px;border-radius:var(--r);padding:14px 16px;font-weight:700;font-size:1.12rem}
.verdict svg{width:30px;height:30px;flex:none}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.no{background:var(--bad-soft);color:var(--bad)}
.verdict .v-sub{display:block;font-weight:400;color:var(--ink);font-size:.98rem}
.steps{background:var(--accent-soft);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px}
.steps summary{cursor:pointer;font-weight:700;color:var(--accent);list-style:none;display:flex;align-items:center;gap:8px}
.steps summary::-webkit-details-marker{display:none}
.steps summary svg{width:20px;height:20px}
.steps ol{margin:0;padding-left:1.4em;display:grid;gap:6px;line-height:1.5}
.steps ol li::marker{font-weight:700;color:var(--accent)}
.steps .h{font-weight:700;color:var(--accent);display:flex;align-items:center;gap:8px}
.steps .h svg{width:20px;height:20px}
.cheer{display:flex;align-items:center;gap:12px;border-radius:var(--r);padding:12px 16px;background:var(--hi-soft);font-weight:700;animation:pop .45s ease-out}
.cheer svg{width:36px;height:36px;flex:none}
.hint{background:var(--hi-soft);border-radius:var(--r);padding:12px 16px;display:flex;gap:10px;align-items:flex-start}
.hint svg{width:22px;height:22px;flex:none;color:var(--g2);margin-top:2px}
.tool-row{display:flex;gap:8px;flex-wrap:wrap}
.summary{display:grid;gap:14px;text-align:center;justify-items:center;padding:26px 20px}
.summary .score{font-family:var(--font-display);font-weight:800;font-size:3.4rem;line-height:1;color:var(--accent)}
.summary .row{justify-content:center}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr));gap:10px;width:100%}
.stat{background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r);padding:12px;text-align:center}
.stat b{display:block;font-family:var(--font-display);font-size:1.6rem;line-height:1.1}
.stat span{font-size:.86rem;color:var(--muted)}
.timer{font-family:var(--font-display);font-weight:800;font-size:1.2rem;min-width:64px;text-align:center;height:46px;display:grid;place-items:center;border-radius:14px;background:var(--accent-soft);color:var(--accent);font-variant-numeric:tabular-nums}
.timer.low{background:var(--bad-soft);color:var(--bad)}

/* learn sheet */
.learn{display:grid;gap:14px}
.learn .ex{border:1.5px dashed var(--line2);border-radius:var(--r);padding:16px;display:grid;gap:12px}

/* hero page */
.hero-top{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
@media (max-width:520px){.hero-top{grid-template-columns:1fr;justify-items:center;text-align:center}.hero-top .who{justify-items:center}}
.namefield{width:100%;max-width:340px;font:700 1.25rem var(--font-body);padding:10px 14px;border-radius:14px;border:2px solid var(--line2);background:var(--paper)}
.namefield:focus{outline:none;border-color:var(--accent)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:44px;height:44px;border-radius:50%;border:3px solid var(--sheet);box-shadow:0 0 0 1.5px var(--line2);padding:0;display:grid;place-items:center}
.sw.on{box-shadow:0 0 0 3.5px var(--accent)}
.sw.lk{opacity:.55;cursor:not-allowed}
.sw.lk svg{width:16px;height:16px;color:#fff;filter:drop-shadow(0 1px 1px rgba(0,0,0,.6))}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.pick{display:grid;gap:4px;justify-items:center;padding:8px 6px 10px;border-radius:var(--r);border:2px solid var(--line);background:var(--sheet);font-size:.85rem;font-weight:700;line-height:1.2;text-align:center}
.pick .ava{width:70px;height:70px}
.pick.on{border-color:var(--accent);background:var(--accent-soft)}
.pick.lk{opacity:.6;cursor:not-allowed}
.pick .lock{display:inline-flex;align-items:center;gap:3px;color:var(--muted);font-size:.78rem}
.pick .lock svg{width:13px;height:13px}
.opt-sec{display:grid;gap:10px}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.badge{display:flex;gap:8px;align-items:center;padding:10px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--sheet);font-size:.86rem;font-weight:700;line-height:1.25;min-width:0}
.badge .medals{display:flex;flex:none}.badge .medals svg{width:24px;height:24px;margin-right:-6px}
.badge span:last-child{min-width:0;overflow-wrap:anywhere}
.sticky-ava{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:3}
@media (max-width:520px){.sticky-ava{position:static}}

/* profiles */
.heroes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:14px}
.pcard{position:relative;display:grid;gap:8px;justify-items:center;padding:18px 14px;text-align:center}
.pcard .pick-me{display:grid;gap:8px;justify-items:center;background:none;border:0;width:100%}
.pcard .ava{width:120px;height:120px}
.pcard.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent),var(--lift)}
.pcard .del{position:absolute;top:10px;right:10px;width:38px;height:38px}
.pcard .del svg{width:18px;height:18px}
.pcard.add{border-style:dashed;align-content:center;min-height:220px;color:var(--accent)}
.pcard.add svg{width:44px;height:44px}
.confirm{display:grid;gap:8px;justify-items:center;font-size:.92rem}

/* parent */
.tablewrap{overflow-x:auto}
table.sk{border-collapse:collapse;width:100%;font-size:.92rem}
table.sk th,table.sk td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.sk th{font-size:.76rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
table.sk td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pillst{display:inline-block;border-radius:99px;padding:2px 10px;font-size:.8rem;font-weight:700;white-space:nowrap}
.pillst.m{background:var(--ok-soft);color:var(--ok)}.pillst.w{background:var(--bad-soft);color:var(--bad)}.pillst.s{background:var(--accent-soft);color:var(--accent)}.pillst.n{background:var(--line);color:var(--muted)}
details.grp{border:1.5px solid var(--line);border-radius:var(--r);background:var(--sheet)}
details.grp>summary{padding:12px 14px;font-weight:700;cursor:pointer;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
details.grp>div{padding:0 14px 12px}
.listrow{display:flex;justify-content:space-between;gap:12px;padding:11px 14px;border-radius:var(--r-sm);background:var(--paper);border:1.5px solid var(--line);font-size:.95rem;align-items:center}
.listrow span:first-child{min-width:0}
.listrow span:last-child{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
textarea.code{width:100%;min-height:200px;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:12px;border-radius:var(--r);border:1.5px solid var(--line2);background:var(--paper);resize:vertical}
.field{width:100%;font-size:1rem;padding:11px 14px;border-radius:14px;border:1.5px solid var(--line2);background:var(--paper)}
.note{font-size:.88rem;color:var(--muted)}
.ok-text{color:var(--ok);font-weight:700}.bad-text{color:var(--bad);font-weight:700}
.sheetmodal{position:fixed;inset:0;z-index:40;display:grid;align-items:end;justify-items:center;background:color-mix(in srgb,var(--ink) 40%,transparent);padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
.sheetmodal .sheet{width:100%;max-width:520px;max-height:85vh;overflow:auto}
@media (min-width:640px){.sheetmodal{align-items:center}}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.toggle:last-of-type{border-bottom:0}
.switch{width:56px;height:32px;border-radius:99px;border:0;background:var(--line2);position:relative;flex:none;padding:0}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch[aria-checked="true"]{background:var(--ok)}
.switch[aria-checked="true"]::after{left:28px}


#app,.stack,.qcard,.answer,.feedback,.learn,.task,.summary,.gband,.topic,.skills,.opt-sec,.learn .ex,.hero-card .who{grid-template-columns:minmax(0,1fr)}
.btn svg{width:22px;height:22px;flex:none}
@media (max-width:460px){.hide-sm{display:none}.practice-head .page-title h1{font-size:1.02rem}.practice-head .page-title .muted{font-size:.82rem}.qcard{padding:18px 16px 20px 30px}.qcard::before{left:16px}.qtext{font-size:1.2rem}}
/* svg classes for drawn questions */
.s-ink{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.s-thin{fill:none;stroke:var(--ink);stroke-width:1.5}
.s-mut{fill:none;stroke:var(--muted);stroke-width:1.5}
.s-grid{fill:none;stroke:var(--line2);stroke-width:1}
.f-ink{fill:var(--ink)}.f-mut{fill:var(--muted)}.f-sheet{fill:var(--sheet)}.f-paper{fill:var(--paper)}
.f-acc{fill:var(--accent)}.f-accs{fill:var(--accent-soft)}.f-hi{fill:var(--hi)}.f-his{fill:var(--hi-soft)}
.f-bad{fill:var(--bad)}.f-ok{fill:var(--ok)}
.f-g1{fill:var(--g1)}.f-g2{fill:var(--g2)}.f-g3{fill:var(--g3)}.f-g4{fill:var(--g4)}.f-g5{fill:var(--g5)}
.st-acc{stroke:var(--accent)}.st-bad{stroke:var(--bad)}.st-g3{stroke:var(--g3)}.st-g5{stroke:var(--g5)}.st-g1{stroke:var(--g1)}
.t-ink{fill:var(--ink);font-family:var(--font-body);font-weight:700}
.t-mut{fill:var(--muted);font-family:var(--font-body)}
.coin-s{fill:#d7dbe2;stroke:#8c939f;stroke-width:2}.coin-g{fill:#e9c158;stroke:#a77d12;stroke-width:2}.coin-t{fill:#d7dbe2;stroke:#8c939f;stroke-width:2}
.coin-txt{fill:#2c3140;font-family:var(--font-body);font-weight:700}

@keyframes rise{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.9);opacity:.5}60%{transform:scale(1.03)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.shake{animation:shake .3s}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;width:100%;height:100%}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<body>
<div id="app"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<script>
'use strict';
/* ---------- basics ---------- */
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const P=a=>a[Math.floor(Math.random()*a.length)];
const SH=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const range=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);
const coin=(p=.5)=>Math.random()<p;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a};
const lcm=(a,b)=>a*b/gcd(a,b);
const fr=(n,d)=>{const g=gcd(n,d)||1;return d/g===1?String(n/g):`${n/g}/${d/g}`};
const fm=c=>'$'+(c/100).toFixed(2);
const tm=(h,m)=>h+':'+String(m).padStart(2,'0');
const plural=(n,w,ws)=>n===1?`${n} ${w}`:`${n} ${ws||w+'s'}`;
const sum=a=>a.reduce((s,x)=>s+x,0);
const neg=v=>v<0?'−'+(-v):String(v);
const factors=n=>range(1,n).filter(i=>n%i===0);
const NAMES=['Mia','Leo','Ava','Sam','Zoe','Noah','Priya','Omar','Lucas','Mei','Amara','Ethan','Sofia','Kai','Hana','Jonah'];
const ITEMS=['stickers','marbles','books','cards','shells','crayons','beads','stamps','apples','pencils'];
const PLACES=['ones','tens','hundreds','thousands','ten thousands','hundred thousands','millions'];
const PVAL=[1,10,100,1000,1e4,1e5,1e6];
const fmtN=n=>Number(n).toLocaleString('en-CA');

/* ---------- values: parse and compare answers ---------- */
function parseVal(s){
  if(s==null)return null;
  let t=String(s).trim().replace(/−/g,'-').replace(/[\s,]+/g,' ').replace(/[$¢%°]/g,'').trim();
  if(/^-?\d+ \d+\/\d+$/.test(t)){const[w,f]=t.split(' ');const[n,d]=f.split('/').map(Number);if(!d)return null;const W=Number(w);return W<0?W-n/d:W+n/d}
  t=t.replace(/ /g,'');
  if(/^-?\d+\/\d+$/.test(t)){const[n,d]=t.split('/').map(Number);return d?n/d:null}
  if(/^-?(\d+\.?\d*|\.\d+)$/.test(t))return Number(t);
  return null;
}
const sameVal=(a,b)=>{const x=parseVal(a),y=parseVal(b);return x!=null&&y!=null&&Math.abs(x-y)<1e-9};
function isRight(given,q){
  const g=String(given).trim();if(!g)return false;
  if(q.kind==='mc')return g===String(q.a);
  if(sameVal(g,q.a))return true;
  return g.replace(/\s+/g,'').toLowerCase()===String(q.a).replace(/\s+/g,'').toLowerCase();
}

/* ---------- question builders ---------- */
/* num: typed answer. mc: answer + distractors, equivalent or duplicate distractors removed. choice: fixed list. */
function num(q,a,steps,x={}){return{kind:'num',q,a:String(a),steps:steps||[],...x}}
function mc(q,a,ds,steps,x={}){
  a=String(a);const want=x.n||3,out=[];
  for(let d of ds){d=String(d);if(d===a||out.includes(d)||sameVal(d,a)||/NaN|undefined|Infinity/.test(d))continue;if(out.some(o=>sameVal(o,d)))continue;if(x.nonneg!==false&&parseVal(d)!=null&&parseVal(d)<0&&!(parseVal(a)<0))continue;out.push(d);if(out.length>=want)break}
  const av=parseVal(a);
  if(out.length<want&&av!=null&&Number.isInteger(av)&&/^-?\d+$/.test(a)){
    for(const k of SH([1,-1,2,-2,3,-3,10,-10,5,-5])){const c=String(av+k);if(av+k<0&&av>=0)continue;if(!out.includes(c)&&c!==a)out.push(c);if(out.length>=want)break}
  }
  return{kind:'mc',q,a,opts:SH([a,...out]),steps:steps||[],...x};
}
function choice(q,a,list,steps,x={}){a=String(a);const opts=list.map(String);if(!opts.includes(a))opts.push(a);return{kind:'mc',q,a,opts:x.shuffle?SH(opts):opts,steps:steps||[],...x}}
const SIGNS=['<','=','>'];
const cmpSign=(x,y)=>x<y?'<':x>y?'>':'=';
const signWord={'<':'is less than','>':'is greater than','=':'is equal to'};

/* ---------- worked-step helpers ---------- */
function digitsR(n){return String(Math.abs(n)).split('').reverse().map(Number)}
function colAddSteps(a,b){
  const A=digitsR(a),B=digitsR(b),n=Math.max(A.length,B.length),st=[];let c=0;
  for(let i=0;i<n;i++){const x=A[i]||0,y=B[i]||0,s=x+y+c,cap=PLACES[i][0].toUpperCase()+PLACES[i].slice(1);
    st.push(`${cap}: ${x} + ${y}${c?' + 1 carried':''} = ${s}.`+(s>=10?` Write ${s%10} and carry 1 to the ${PLACES[i+1]}.`:` Write ${s}.`));c=s>=10?1:0}
  if(c)st.push(`Write the carried 1 in the ${PLACES[n]} place.`);
  st.push(`So ${fmtN(a)} + ${fmtN(b)} = <b>${fmtN(a+b)}</b>.`);return st;
}
function colSubSteps(a,b){
  const A=digitsR(a),B=digitsR(b),st=[];
  for(let i=0;i<A.length;i++){const y=B[i]||0,cap=PLACES[i][0].toUpperCase()+PLACES[i].slice(1);
    if(A[i]<y){let j=i+1;while(A[j]===0)j++;const top=A[i];A[j]--;for(let k=j-1;k>i;k--)A[k]=9;A[i]+=10;
      st.push(`${cap}: ${top} is less than ${y}, so regroup 1 from the ${PLACES[j]}${j>i+1?' (the zeros in between become 9s)':''}. Now ${A[i]} − ${y} = ${A[i]-y}.`)}
    else if(i<B.length||A[i]) st.push(`${cap}: ${A[i]} − ${y} = ${A[i]-y}.`)}
  st.push(`So ${fmtN(a)} − ${fmtN(b)} = <b>${fmtN(a-b)}</b>.`);return st;
}
function splitParts(b){return digitsR(b).map((d,i)=>d*PVAL[i]).filter(Boolean).reverse()}
function splitAddSteps(a,b){const ps=splitParts(b);let r=a;const st=[`Break ${b} into ${ps.join(' + ')}.`];for(const p of ps){st.push(`${r} + ${p} = ${r+p}`);r+=p}st[st.length-1]=st[st.length-1].replace(/= (\d+)$/,'= <b>$1</b>');return st}
function splitSubSteps(a,b){const ps=splitParts(b);let r=a;const st=[`Break ${b} into ${ps.join(' + ')} and take away one part at a time.`];for(const p of ps){st.push(`${r} − ${p} = ${r-p}`);r-=p}st[st.length-1]=st[st.length-1].replace(/= (\d+)$/,'= <b>$1</b>');return st}
function makeTen(a,b){ // a+b with a+b>10 using make-a-ten
  const big=Math.max(a,b),small=Math.min(a,b),need=10-big;
  if(a+b<=10||need<=0||need>=small)return[`Start at ${big} and count on ${small}.`,`${a} + ${b} = <b>${a+b}</b>`];
  return[`Make a ten: ${big} needs ${need} more to make 10.`,`Split ${small} into ${need} + ${small-need}.`,`${big} + ${need} = 10, then 10 + ${small-need} = <b>${a+b}</b>`];
}
function backTen(a,b){ // a-b crossing ten
  if(a<=10||a-b>=10||a%10>=b)return[`Start at ${a} and count back ${b}.`,`${a} − ${b} = <b>${a-b}</b>`];
  const o=a%10;return[`Take away ${o} to get to 10: ${a} − ${o} = ${a-o}.`,`You still need to take away ${b-o} more.`,`${a-o} − ${b-o} = <b>${a-b}</b>`];
}

/* ---------- speech text ---------- */
function speakText(html){
  let t=String(html).replace(/<sup>(\d+)<\/sup>/g,' to the power of $1 ').replace(/<br\s*\/?>/g,'. ').replace(/<[^>]+>/g,' ');
  t=t.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'and').replace(/&#39;/g,"'").replace(/&quot;/g,'"');
  t=t.replace(/○/g,' circle ').replace(/__/g,' blank ').replace(/×/g,' times ').replace(/÷/g,' divided by ').replace(/−/g,' minus ').replace(/\+/g,' plus ').replace(/=/g,' equals ').replace(/¢/g,' cents').replace(/°/g,' degrees').replace(/%/g,' percent').replace(/→/g,' goes to ');
  t=t.replace(/(\d+)\/(\d+)/g,'$1 over $2');
  return t.replace(/\s+/g,' ').trim();
}
/* ---------- drawn visuals (inline SVG, themed through CSS classes) ---------- */
const svgWrap=(w,h,inner,label,disp)=>`<svg class="vis" viewBox="0 0 ${w} ${h}" width="${disp||w}" role="img" aria-label="${esc(label||'picture')}">${inner}</svg>`;
const rd=n=>Math.round(n*10)/10;
const pt=(cx,cy,r,deg)=>[rd(cx+r*Math.cos(deg*Math.PI/180)),rd(cy+r*Math.sin(deg*Math.PI/180))];
const FILLS=['f-g1','f-g2','f-g3','f-g4','f-g5','f-acc'];
const txt=(x,y,s,o={})=>`<text x="${x}" y="${y}" class="${o.c||'t-ink'}" font-size="${o.s||14}" text-anchor="${o.a||'middle'}"${o.b?` dominant-baseline="${o.b}"`:''}>${s}</text>`;

function vClock(h,m){
  let s=`<circle cx="100" cy="100" r="92" class="f-sheet s-ink" style="stroke-width:4"/>`;
  for(let i=0;i<60;i++){const big=i%5===0,[x1,y1]=pt(100,100,big?80:85,i*6-90),[x2,y2]=pt(100,100,89,i*6-90);s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="s-thin" style="stroke-width:${big?2.5:1.2}"/>`}
  for(let i=1;i<=12;i++){const[x,y]=pt(100,100,66,i*30-90);s+=txt(x,y+6,i,{s:17})}
  const ha=(h%12)*30+m*.5-90,ma=m*6-90,[hx,hy]=pt(100,100,44,ha),[mx,my]=pt(100,100,74,ma);
  s+=`<line x1="100" y1="100" x2="${hx}" y2="${hy}" class="s-ink" style="stroke-width:7"/>`;
  s+=`<line x1="100" y1="100" x2="${mx}" y2="${my}" class="s-ink st-acc" style="stroke-width:4"/>`;
  s+=`<circle cx="100" cy="100" r="6" class="f-ink"/>`;
  return svgWrap(200,200,s,'An analogue clock',190);
}
function shadeSet(n,k){return new Set(SH(range(0,n-1)).slice(0,k))}
function vFracBar(n,k,sh){sh=sh||new Set(range(0,k-1));const w=300/n;let s='';for(let i=0;i<n;i++)s+=`<rect x="${2+i*w}" y="2" width="${w}" height="56" class="${sh.has(i)?'f-acc':'f-sheet'} s-ink"/>`;return svgWrap(304,60,s,`A bar cut into ${n} equal parts`,300)}
function vFracPie(n,k,sh){sh=sh||new Set(range(0,k-1));let s='';const r=76,c=80,off=-90;
  for(let i=0;i<n;i++){const[a1,b1]=pt(c,c,r,off+i*360/n),[a2,b2]=pt(c,c,r,off+(i+1)*360/n);s+=`<path d="M${c} ${c}L${a1} ${b1}A${r} ${r} 0 ${360/n>180?1:0} 1 ${a2} ${b2}Z" class="${sh.has(i)?'f-acc':'f-sheet'} s-ink"/>`}
  return svgWrap(160,160,s,`A circle cut into ${n} equal parts`,160)}
function vFracGrid(n,k,sh){const cols=n===4?2:n===6?3:n===8?4:n===9?3:n===10?5:n===12?4:n;const rows=n/cols,cw=60;sh=sh||new Set(range(0,k-1));let s='';for(let i=0;i<n;i++){const r=Math.floor(i/cols),c=i%cols;s+=`<rect x="${2+c*cw}" y="${2+r*cw}" width="${cw}" height="${cw}" class="${sh.has(i)?'f-acc':'f-sheet'} s-ink"/>`}return svgWrap(cols*cw+4,rows*cw+4,s,`A rectangle cut into ${n} equal parts`)}
function vFrac(n,k,mix=true){const sh=mix?shadeSet(n,k):null;const opts=['bar','pie'];if([4,6,8,9,10,12].includes(n))opts.push('grid');const t=P(opts);return t==='bar'?vFracBar(n,k,sh):t==='pie'?vFracPie(n,k,sh):vFracGrid(n,k,sh)}

function vNumberLine(o){ // {min,max,step,dot,labels:[values]|'all'|'ends', fmt}
  const W=330,x0=22,x1=W-22,cnt=Math.round((o.max-o.min)/o.step),X=v=>rd(x0+(v-o.min)/(o.max-o.min)*(x1-x0));let s=`<line x1="${x0-12}" y1="40" x2="${x1+12}" y2="40" class="s-ink"/><path d="M${x0-16} 40l8-6v12zM${x1+16} 40l-8-6v12z" class="f-ink"/>`;
  for(let i=0;i<=cnt;i++){const v=o.min+i*o.step;s+=`<line x1="${X(v)}" y1="30" x2="${X(v)}" y2="50" class="s-ink"/>`;
    const lab=o.labels==='all'||(o.labels==='ends'&&(i===0||i===cnt))||(Array.isArray(o.labels)&&o.labels.includes(v));if(lab)s+=txt(X(v),72,o.fmt?o.fmt(v):neg(v),{s:15})}
  if(o.dot!=null)s+=`<circle cx="${X(o.dot)}" cy="40" r="8" class="f-bad"/>`;
  return svgWrap(W,82,s,'A number line',W)}

function vTally(n){let s='',x=10;const g=Math.floor(n/5),r=n%5;

S('g2sol',2,'Faces of 3D shapes','A face is a flat surface you could trace around.',()=>{const L=[['cube',6],['rectangular prism',6],['cylinder',2],['cone',1],['sphere',0],['square pyramid',5],['triangular prism',5]],s=P(L);
  return num(`How many flat faces does this <b>${s[0]}</b> have?`,s[1],[`Count the flat surfaces, including the ones you cannot see at the back and bottom.`,`A ${s[0]} has <b>${s[1]}</b> flat face${s[1]===1?'':'s'}.`],{vis:vSolid(s[0])})});
S('g2io',2,'Input and output rules','Find the rule from the first rows, then use it.',()=>{const d=R(2,15),add=coin(.6),x=SH(range(add?1:d+1,add?30:d+30)).slice(0,4),f=v=>add?v+d:v-d;
  const vis=`<table class="io"><thead><tr><th>In</th><th>Out</th></tr></thead><tbody>${x.map((v,i)=>`<tr><td>${v}</td><td>${i<3?f(v):'?'}</td></tr>`).join('')}</tbody></table>`;
  return num('Find the rule. What is the missing output?',f(x[3]),[`Look at a row: ${x[0]} becomes ${f(x[0])}.`,`The rule is ${add?'add':'subtract'} ${d}.`,`${x[3]} ${add?'+':'−'} ${d} = <b>${f(x[3])}</b>`],{vis})});
S('g2bal',2,'Balance the equation','Both sides of = must have the same total.',()=>{const a=R(3,15),b=R(3,15),s=a+b;if(coin()){const c=R(1,s-1);return num(`<span class="big">${a} + ${b} = __ + ${c}</span>Find the missing number.`,s-c,[`The left side is ${a} + ${b} = ${s}.`,`So __ + ${c} must also be ${s}.`,`${s} − ${c} = <b>${s-c}</b>`])}
  const c=R(1,s-1),d=s-c;if(d<=a)return SK.g2bal.gen();return num(`<span class="big">${a} + __ = ${c} + ${d}</span>Find the missing number.`,s-a,[`The right side is ${c} + ${d} = ${s}.`,`So ${a} + __ = ${s}.`,`${s} − ${a} = <b>${s-a}</b>`])});
S('g2lu',2,'Choose the right unit','Centimetres for small things, metres for big things, kilometres for long trips.',()=>{const L=[['a pencil','centimetres'],['a crayon','centimetres'],['a spoon','centimetres'],['your hand','centimetres'],['a book','centimetres'],['a ladybug','centimetres'],['a school bus','metres'],['a soccer field','metres'],['a classroom','metres'],['a swimming pool','metres'],['a tall tree','metres'],['the drive to another city','kilometres'],['a bike trail through a park','kilometres'],['a flight across Canada','kilometres']],s=P(L);
  return choice(`Which unit is best for measuring <b>${s[0]}</b>?`,s[1],['centimetres','metres','kilometres'],[`Small things fit in your hand: centimetres. Room-sized and bigger: metres. Long trips: kilometres.`,`For ${s[0]}, use <b>${s[1]}</b>.`])});
S('g2ct',2,'Toonies and loonies','A toonie is $2 and a loonie is $1.',()=>{const a=R(1,4),b=R(1,5),list=[...Array(a).fill('T'),...Array(b).fill('L')];
  return num('How many dollars are these coins worth?',2*a+b,[`${plural(a,'toonie')}: ${a} × $2 = $${2*a}.`,`${plural(b,'loonie')}: ${b} × $1 = $${b}.`,`$${2*a} + $${b} = <b>$${2*a+b}</b>`],{vis:vCoins(list),unit:'dollars'})});
S('g2arr',2,'Arrays','An array has equal rows. Add the rows, or multiply rows by columns.',()=>{const r=R(2,5),c=R(2,6);return num('How many dots are in this array?',r*c,[`There are ${r} rows of ${c}.`,`${Array(r).fill(c).join(' + ')} = <b>${r*c}</b>`],{vis:vDots(r,c)})});
S('g2hr',2,'Time hours later','Move the hour forward. The minutes stay the same.',()=>{const h=R(1,12),m=P([0,15,30,45]),d=R(1,3),e=(h-1+d)%12+1,a=tm(e,m);
  return mc(`It is <b>${tm(h,m)}</b>. What time will it be in <b>${plural(d,'hour')}</b>?`,a,[tm(e%12+1,m),tm((h+10)%12+1,m),tm(e,(m+30)%60),tm(h,m)],[`Count ${d} hour${d>1?'s':''} forward from ${h}: ${range(1,d).map(i=>(h-1+i)%12+1).join(', ')}.`,`The minutes stay at ${String(m).padStart(2,'0')}.`,`It will be <b>${a}</b>.`],{optClass:'sym'})});
S('g2m10',2,'10 or 100 more or less','Adding 10 changes the tens digit. Adding 100 changes the hundreds digit.',()=>{const n=R(110,890),d=P([10,100]),up=coin(),a=up?n+d:n-d;
  return num(`What is <b>${d} ${up?'more':'less'}</b> than <b>${n}</b>?`,a,[`${d===10?'The tens digit':'The hundreds digit'} goes ${up?'up':'down'} by 1.`,`${n} ${up?'+':'−'} ${d} = <b>${a}</b>`])});
S('g2ln',2,'Read a number line','Find how much each mark is worth, then count the marks.',()=>{const d=P([1,2,5,10]),a=d*R(0,10),k=R(1,4),ans=a+k*d;
  return mc('What number does the dot show?',ans,[ans+d,ans-d,ans+2*d,a+k,ans+1],[`From ${a} to ${a+5*d} there are 5 jumps, so each mark is ${d}.`,`The dot is ${k} mark${k>1?'s':''} past ${a}.`,`${a} + ${k} × ${d} = <b>${ans}</b>`],{vis:vNumberLine({min:a,max:a+5*d,step:d,labels:'ends',dot:ans}),optClass:'sym'})});
/* ===== GRADE 3 ===== */
const P4=['thousands','hundreds','tens','ones'];
function cmpSteps(a,b,s){if(a===b)return[`Both numbers are the same.`,`So ${fmtN(a)} <b>=</b> ${fmtN(b)}.`];const A=String(a),B=String(b);if(A.length!==B.length)return[`${fmtN(Math.max(a,b))} has more digits, so it is bigger.`,`${fmtN(a)} ${signWord[s]} ${fmtN(b)}: <b>${esc(s)}</b>`];const i=[...A].findIndex((d,j)=>d!==B[j]),pl=PLACES[A.length-1-i];
  return[i?`The digits match until the ${pl} place.`:`Start with the ${pl} place.`,`Compare the ${pl} digits: ${A[i]} and ${B[i]}.`,`So ${fmtN(a)} ${signWord[s]} ${fmtN(b)}: <b>${esc(s)}</b>`]}
function roundSteps(n,p){const a=Math.round(n/p)*p,lo=Math.floor(n/p)*p,dg=Math.floor(n%p/(p/10));return[`${fmtN(n)} is between ${fmtN(lo)} and ${fmtN(lo+p)}.`,`Look at the digit to the right of the ${PLACES[Math.log10(p)]} place: ${dg}.`,`${dg>=5?'5 or more rounds up':'Less than 5 rounds down'}, so the answer is <b>${fmtN(a)}</b>.`]}
S('g3pv',3,'Value of a digit (to thousands)','Name the place of the digit, then multiply by that place value.',()=>{let d;do{d=[R(1,9),R(0,9),R(0,9),R(0,9)]}while(new Set(d).size<4);const p=R(0,3),v=d[p]*[1000,100,10,1][p];
  return num(`What is the value of the digit <b>${d[p]}</b> in <b>${fmtN(+d.join(''))}</b>?`,v,[`The ${d[p]} is in the ${P4[p]} place.`,`${d[p]} × ${fmtN([1000,100,10,1][p])} = <b>${fmtN(v)}</b>`])});
S('g3exp',3,'Expanded form','Each part of expanded form is one digit times its place value.',()=>{const a=R(1,9),b=R(0,9),c=R(0,9),d=R(0,9),n=a*1000+b*100+c*10+d,parts=[a*1000,b*100,c*10,d].filter(Boolean);
  if(coin())return num(`<span class="big">${parts.map(fmtN).join(' + ')} = ?</span>`,n,[`${a} thousands, ${b} hundreds, ${c} tens, ${d} ones.`,`Write the digits in place: <b>${fmtN(n)}</b>.`]);
  const mi=R(0,parts.length-1);return num(`<span class="big">${fmtN(n)} = ${parts.map((x,i)=>i===mi?'__':fmtN(x)).join(' + ')}</span>Find the missing number.`,parts[mi],[`${fmtN(n)} = ${parts.map(fmtN).join(' + ')}.`,`The missing part is <b>${fmtN(parts[mi])}</b>.`])});
S('g3cmp',3,'Compare numbers to 10,000','Compare from the biggest place. The first different digit decides.',()=>{const a=R(1000,9999),b=coin(.12)?a:Math.max(1000,Math.min(9999,a+P([R(-900,900),R(-90,90),R(-9,9)]))),s=cmpSign(a,b);
  return choice(`Which sign goes in the circle?<span class="big">${fmtN(a)} ○ ${fmtN(b)}</span>`,s,SIGNS,cmpSteps(a,b,s),{optClass:'sym',cols:3})});
S('g3rnd',3,'Round to 10, 100 or 1000','Look one place to the right. 5 or more rounds up.',()=>{const p=P([10,100,1000]),n=R(1001,9999);if(n%p===0)return SK.g3rnd.gen();return num(`Round <b>${fmtN(n)}</b> to the nearest <b>${fmtN(p)}</b>.`,Math.round(n/p)*p,roundSteps(n,p))});
S('g3add',3,'Add up to four digits','Line up the places. Add from the ones and carry when you get 10 or more.',()=>{const a=R(100,6000),b=R(100,9999-a);return num(`<span class="big">${fmtN(a)} + ${fmtN(b)} = ?</span>`,a+b,colAddSteps(a,b))});
S('g3sub',3,'Subtract up to four digits','Line up the places. Regroup when the top digit is smaller.',()=>{const a=R(1000,9999),b=R(100,a-1);return num(`<span class="big">${fmtN(a)} − ${fmtN(b)} = ?</span>`,a-b,colSubSteps(a,b))});
S('g3mul',3,'Multiplication facts to 12','Split a hard fact into two easier ones.',()=>{const a=R(2,12),b=R(2,12);
  return num(`<span class="big">${a} × ${b} = ?</span>`,a*b,b>5?[`Split ${b} into 5 + ${b-5}.`,`${a} × 5 = ${a*5} and ${a} × ${b-5} = ${a*(b-5)}.`,`${a*5} + ${a*(b-5)} = <b>${a*b}</b>`]:[`Skip-count by ${a}, ${b} times: ${range(1,b).map(i=>a*i).join(', ')}.`,`${a} × ${b} = <b>${a*b}</b>`])});
S('g3mul2',3,'Multiply two digits by one digit','Break the two-digit number into tens and ones, multiply each, then add.',()=>{const a=R(11,49),b=R(2,9),t=Math.floor(a/10)*10,o=a%10;if(!o)return SK.g3mul2.gen();
  return num(`<span class="big">${a} × ${b} = ?</span>`,a*b,[`Break ${a} into ${t} + ${o}.`,`${t} × ${b} = ${t*b}`,`${o} × ${b} = ${o*b}`,`${t*b} + ${o*b} = <b>${a*b}</b>`])});
S('g3div',3,'Division facts to 12','Use the matching multiplication fact.',()=>{const d=R(2,12),k=R(2,12);return num(`<span class="big">${d*k} ÷ ${d} = ?</span>`,k,[`Ask: ${d} × ? = ${d*k}.`,`${d} × ${k} = ${d*k}.`,`So ${d*k} ÷ ${d} = <b>${k}</b>`])});
S('g3fac',3,'Multiples','A multiple of 4 is in the 4 times table: 4, 8, 12, 16 and so on.',()=>{const k=R(2,9),m=R(2,10),a=k*m;
  if(coin(.4)){const n=coin()?a:a+R(1,k-1);const y=n%k===0;return choice(`Is <b>${n}</b> a multiple of <b>${k}</b>?`,y?'yes':'no',['yes','no'],[y?`${k} × ${n/k} = ${n}.`:`${k} × ${Math.floor(n/k)} = ${k*Math.floor(n/k)} and ${k} × ${Math.floor(n/k)+1} = ${k*(Math.floor(n/k)+1)}. ${n} is in between.`,`So the answer is <b>${y?'yes':'no'}</b>.`])}
  return mc(`Which number is a multiple of <b>${k}</b>?`,a,[a+1,a-1,a+2,a-2,a+3].filter(x=>x%k),[`Count by ${k}s: ${range(1,m).map(i=>i*k).join(', ')}.`,`<b>${a}</b> is on the list.`],{optClass:'sym'})});
S('g3eq',3,'Solve for the unknown','Do the opposite operation to find the missing number.',()=>{const v=P(['n','x','y','a','b']),t=R(0,3),a=R(2,12),b=R(2,12);
  if(t===0)return num(`Solve for ${v}:<span class="big">${v} + ${a} = ${a+b}</span>`,b,[`The opposite of adding ${a} is subtracting ${a}.`,`${a+b} − ${a} = <b>${b}</b>`]);
  if(t===1)return num(`Solve for ${v}:<span class="big">${v} − ${a} = ${b}</span>`,a+b,[`The opposite of subtracting ${a} is adding ${a}.`,`${b} + ${a} = <b>${a+b}</b>`]);
  if(t===2)return num(`Solve for ${v}:<span class="big">${a} × ${v} = ${a*b}</span>`,b,[`The opposite of multiplying by ${a} is dividing by ${a}.`,`${a*b} ÷ ${a} = <b>${b}</b>`]);
  return num(`Solve for ${v}:<span class="big">${v} ÷ ${a} = ${b}</span>`,a*b,[`The opposite of dividing by ${a} is multiplying by ${a}.`,`${b} × ${a} = <b>${a*b}</b>`])});
S('g3word',3,'Multiplication and division word problems','"Each" and "groups of" often mean multiply. "Shared equally" means divide.',()=>{const n=P(NAMES),i=P(ITEMS),a=R(3,9),b=R(3,9),t=R(0,3);
  if(t===0)return num(`${n} has ${a} bags. Each bag holds ${b} ${i}. How many ${i} are there in all?`,a*b,[`${a} groups of ${b}: multiply.`,`${a} × ${b} = <b>${a*b}</b>`]);
  if(t===1)return num(`${n} shares ${a*b} ${i} equally among ${a} friends. How many ${i} does each friend get?`,b,[`Sharing equally means divide.`,`${a*b} ÷ ${a} = <b>${b}</b>`]);
  if(t===2)return num(`A garden has ${a} rows of plants with ${b} plants in each row. How many plants are there?`,a*b,[`Rows of equal size: multiply.`,`${a} × ${b} = <b>${a*b}</b>`]);
  return num(`${a*b} students get into teams of ${b}. How many teams are there?`,a,[`How many groups of ${b} fit in ${a*b}? Divide.`,`${a*b} ÷ ${b} = <b>${a}</b>`])});
S('g3frac',3,'Name the shaded fraction','Count all equal parts for the bottom, shaded parts for the top.',()=>{const n=P([3,4,5,6,8]),k=R(1,n-1),a=`${k}/${n}`;
  return mc('What fraction is shaded?',a,[`${n-k}/${n}`,`${k}/${n+1}`,`${k+1}/${n}`,`${n}/${k}`,`1/${n}`],[`There are ${n} equal parts and ${k} ${k>1?'are':'is'} shaded.`,`The fraction is <b>${a}</b>.`],{vis:vFrac(n,k),optClass:'sym'})});
S('g3eqf',3,'Equivalent fractions','Whatever you multiply the bottom by, multiply the top by the same.',()=>{const f=P([[1,2],[1,3],[2,3],[1,4],[3,4]]),m=R(2,4);
  return num(`<span class="big">${f[0]}/${f[1]} = __/${f[1]*m}</span>Find the missing top number.`,f[0]*m,[`The bottom went from ${f[1]} to ${f[1]*m}: that is × ${m}.`,`Do the same to the top: ${f[0]} × ${m} = <b>${f[0]*m}</b>.`],{vis:`<div class="stack" style="justify-items:center">${vFracBar(f[1],f[0])}${vFracBar(f[1]*m,f[0]*m)}</div>`})});
S('g3cmpf',3,'Compare fractions','Same bottom: bigger top wins. Same top: smaller bottom means bigger pieces.',()=>{if(coin()){const d=R(3,12),a=R(1,d-1),b=R(1,d-1),s=cmpSign(a,b);return choice(`Compare the fractions.<span class="big">${a}/${d} ○ ${b}/${d}</span>`,s,SIGNS,[`The bottoms are the same, so compare the tops: ${a} and ${b}.`,`${a}/${d} ${signWord[s]} ${b}/${d}: <b>${esc(s)}</b>`],{optClass:'sym',cols:3})}
  const t=R(1,3),x=R(t+1,12),y=R(t+1,12),s=x>y?'<':x<y?'>':'=';return choice(`Compare the fractions.<span class="big">${t}/${x} ○ ${t}/${y}</span>`,s,SIGNS,[`The tops are the same. A smaller bottom number means bigger pieces.`,x===y?'The fractions are the same.':`${t}/${Math.min(x,y)} has bigger pieces, so it is bigger.`,`The answer is <b>${esc(s)}</b>.`],{optClass:'sym',cols:3})});
S('g3dec',3,'Add and subtract tenths','Line up the decimal points and add or subtract the tenths.',()=>{let x,y,s;const ad=coin();do{x=R(11,89);y=R(11,89);if(!ad&&x<y)[x,y]=[y,x];s=ad?x+y:x-y}while(x%10===0||y%10===0||s%10===0||s<=0);const f=v=>(v/10).toFixed(1);
  return num(`<span class="big">${f(x)} ${ad?'+':'−'} ${f(y)} = ?</span>`,f(s),[`Think in tenths: ${f(x)} is ${x} tenths and ${f(y)} is ${y} tenths.`,`${x} ${ad?'+':'−'} ${y} = ${s} tenths.`,`${s} tenths = <b>${f(s)}</b>`])});
S('g3money',3,'Add money amounts','Add the dollars and cents, lining up the decimal points.',()=>{const a=R(150,899),b=R(150,899),t=a+b,n=P(NAMES),pair=P([['a book','a pen'],['a sandwich','a juice'],['a toy car','a ball'],['a notebook','markers']]);
  return mc(`${n} buys ${pair[0]} for ${fm(a)} and ${pair[1]} for ${fm(b)}. How much does ${n} spend in all?`,fm(t),[fm(t+10),fm(t-10),fm(t+100),fm(t-100),fm(t+1)],[`Think in cents: ${a}¢ + ${b}¢ = ${t}¢.`,`${t}¢ = <b>${fm(t)}</b>`])});
S('g3time',3,'Read a clock to the minute','Count the long hand by 5s to the last number, then count the small marks.',()=>{const h=R(1,12),m=R(1,59);if(m%5===0)return SK.g3time.gen();const a=tm(h,m),f=Math.floor(m/5)*5;
  return mc('What time does the clock show?',a,[tm(h%12+1,m),tm(h,(m+30)%60),tm(h,60-m),tm((h+10)%12+1,m),tm(h,(m+5)%60)],[`The short hand is past ${h}, so the hour is ${h}.`,`The long hand is past the ${f/5||12}: that is ${f} minutes. Count ${m-f} small mark${m-f>1?'s':''} more.`,`${f} + ${m-f} = ${m} minutes. The time is <b>${a}</b>.`],{vis:vClock(h,m),optClass:'sym'})});
S('g3el',3,'Elapsed time','Count on to the next hour, then count the rest.',()=>{const h=R(1,11),m=P([0,5,10,15,20,30,45]),d=P([15,20,25,30,35,40,45,50,55,60,75,90]),tot=m+d,hh=(h-1+Math.floor(tot/60))%12+1,s=tm(h,m),e=tm(hh,tot%60);
  const st=m&&d>60-m?[`From ${s} to ${tm(h%12+1,0)} is ${60-m} minutes.`,`From ${tm(h%12+1,0)} to ${e} is ${d-(60-m)} minutes.`,`${60-m} + ${d-(60-m)} = <b>${d}</b> minutes`]:[`Count on from ${s} to ${e}.`,`That is <b>${d}</b> minutes.`];
  return num(`A show starts at <b>${s}</b> and ends at <b>${e}</b>. How many minutes long is it?`,d,st,{unit:'min'})});
S('g3unit',3,'Convert units','Multiply by how many small units fit in one big unit.',()=>{const u=P([['metre','centimetres',100],['hour','minutes',60],['kilogram','grams',1000],['centimetre','millimetres',10],['litre','millilitres',1000],['minute','seconds',60]]),k=R(2,9);
  return num(`How many ${u[1]} are in <b>${k} ${u[0]}s</b>?`,k*u[2],[`1 ${u[0]} = ${fmtN(u[2])} ${u[1]}.`,`${k} × ${fmtN(u[2])} = <b>${fmtN(k*u[2])}</b> ${u[1]}`])});
S('g3peri',3,'Perimeter of polygons','Add the lengths of all the sides.',()=>{if(coin()){const l=R(3,15),w=R(2,12);return num('What is the perimeter of this rectangle?',2*(l+w),[`Add all 4 sides: ${l} + ${w} + ${l} + ${w}.`,`= <b>${2*(l+w)}</b> cm`],{vis:vRect(l,w,'cm'),unit:'cm'})}
  const n=P([3,5,6]),sides=range(1,n).map(()=>R(3,12)),nm={3:'triangle',5:'pentagon',6:'hexagon'}[n];return num(`A ${nm} has sides of ${sides.join(' cm, ')} cm. What is its perimeter?`,sum(sides),[`Add all ${n} sides.`,`${sides.join(' + ')} = <b>${sum(sides)}</b> cm`],{unit:'cm',vis:vPolygon(n,{jit:10})})});
S('g3area',3,'Area of rectangles','Area = length × width. It is the number of unit squares inside.',()=>{const l=R(2,12),w=R(2,10);return num('What is the area of this rectangle?',l*w,[`Area = length × width.`,`${l} × ${w} = <b>${l*w}</b> square cm`],{vis:vRect(l,w,'cm'),unit:'sq cm'})});
S('g3ang',3,'Types of angles','Right = 90° (a square corner). Acute is less. Obtuse is more, up to 180°.',()=>{const t=P(['acute','right','obtuse','straight']),d=t==='acute'?R(20,80):t==='right'?90:t==='obtuse'?R(100,165):180;
  return choice('What type of angle is this?',t,['acute','right','obtuse','straight'],[`Compare it with a square corner (90°).`,t==='right'?'It makes a square corner, so it is a <b>right</b> angle.':t==='acute'?'It is narrower than a square corner, so it is <b>acute</b>.':t==='obtuse'?'It is wider than a square corner but not a straight line, so it is <b>obtuse</b>.':'It makes a straight line, so it is a <b>straight</b> angle.'],{vis:vAngle(d)})});
S('g3mode',3,'Find the mode','The mode is the number that appears most often.',()=>{const p=SH(range(1,12)),m=p[0],l=SH([m,m,m,...p.slice(1,4),p[4],p[4]]);
  return num(`Find the mode.<span class="big">${l.join(', ')}</span>`,m,[`Count how often each number appears.`,`${m} appears 3 times, more than any other number.`,`The mode is <b>${m}</b>.`])});
S('g3mean',3,'Find the mean','Add all the numbers, then divide by how many there are.',()=>{for(;;){const m=R(3,12),a=R(1,15),b=R(1,15),c=R(1,15),d=4*m-a-b-c;if(d>=1&&d<=15){const l=[a,b,c,d];return num(`Find the mean (average).<span class="big">${l.join(', ')}</span>`,m,[`Add them: ${l.join(' + ')} = ${4*m}.`,`There are 4 numbers: ${4*m} ÷ 4 = <b>${m}</b>`])}}});
S('g3coord',3,'Coordinate grid','The first number goes across. The second number goes up.',()=>{const x=R(1,9),y=R(1,9);if(x===y&&coin(.7))return SK.g3coord.gen();
  if(coin(.6))return mc('What are the coordinates of point A?',`(${x}, ${y})`,[`(${y}, ${x})`,`(${x+1}, ${y})`,`(${x}, ${y+1})`,`(${x-1||x+2}, ${y})`,`(${x}, ${y-1||y+2})`],[`Go across from 0 to point A: ${x}.`,`Then go up: ${y}.`,`The coordinates are <b>(${x}, ${y})</b>.`],{vis:vGrid(10,[[x,y,'A']]),optClass:'sym'});
  const pool=[[y,x],[x,Math.max(0,y-2)||y+1],[Math.max(0,x-2)||x+1,y],[R(1,9),R(1,9)],[R(1,9),R(1,9)],[R(1,9),R(1,9)]].map(p=>p.join(',')),pts=[x+','+y];for(const p of pool){if(!pts.includes(p))pts.push(p);if(pts.length===3)break}SH(pts);pts.sort(()=>Math.random()-.5);const labs=['A','B','C'],ps=pts.map((p,i)=>[...p.split(',').map(Number),labs[i]]),ans=labs[pts.indexOf(x+','+y)];
  return choice(`Which point is at <b>(${x}, ${y})</b>?`,ans,labs,[`Go ${x} across, then ${y} up.`,`That is point <b>${ans}</b>.`],{vis:vGrid(10,ps),optClass:'sym',cols:3})});
S('g3prob',3,'Probability of picking a colour','Probability = how many of that colour ÷ how many in all.',()=>{const N=['red','blue','green'],c=N.map(()=>R(1,6)),t=sum(c),i=R(0,2),a=`${c[i]}/${t}`;const counts={};N.forEach((k,j)=>counts[k]=c[j]);
  if(coin(.35)){const mx=Math.max(...c);if(c.filter(v=>v===mx).length>1)return SK.g3prob.gen();const w=N[c.indexOf(mx)];return choice('Which colour are you most likely to pick?',w,N,[`Count each colour: ${N.map((k,j)=>k+' '+c[j]).join(', ')}.`,`There are the most ${w} marbles, so <b>${w}</b> is most likely.`],{vis:vBag(counts)})}
  return mc(`What is the probability of picking a <b>${N[i]}</b> marble?`,a,[`${c[(i+1)%3]}/${t}`,`${c[i]}/${t-c[i]||t+1}`,`${t}/${c[i]}`,`${c[(i+2)%3]}/${t}`,`1/${t}`],[`There are ${t} marbles in all. ${c[i]} are ${N[i]}.`,`The probability is ${c[i]} out of ${t}: <b>${a}</b>.`],{vis:vBag(counts),optClass:'sym'})});
S('g3est',3,'Estimate by rounding','Round each number first, then add or subtract the rounded numbers.',()=>{const a=R(120,880),b=R(120,880),ra=Math.round(a/100)*100,rb=Math.round(b/100)*100,ad=coin(.6)||ra<rb;if(!ad&&ra===rb)return SK.g3est.gen();
  return num(`Estimate by rounding each number to the nearest hundred.<span class="big">${a} ${ad?'+':'−'} ${b}</span>`,ad?ra+rb:ra-rb,[`${a} rounds to ${ra}. ${b} rounds to ${rb}.`,`${ra} ${ad?'+':'−'} ${rb} = <b>${ad?ra+rb:ra-rb}</b>`])});
S('g3nl',3,'Fractions on a number line','Count the equal jumps from 0 to 1. That is the bottom number.',()=>{const n=P([2,3,4,5,6,8]),k=R(1,n-1);
  return mc('What fraction does the dot show?',`${k}/${n}`,[`${k}/${n+1}`,`${k+1}/${n}`,`${n-k}/${n}`,`${k}/${n-1}`],[`The line from 0 to 1 is cut into ${n} equal jumps.`,`The dot is ${k} jump${k>1?'s':''} from 0.`,`It shows <b>${k}/${n}</b>.`],{vis:vNumberLine({min:0,max:1,step:1/n,dot:k/n,labels:[0,1]}),optClass:'sym'})});
S('g3vol',3,'Volume with unit cubes','Count the cubes in one layer, then multiply by the number of layers.',()=>{const l=R(2,5),w=R(2,4),h=R(2,4);
  return num(`This box is filled with 1 cm cubes. It is ${l} cubes long, ${w} cubes deep and ${h} cubes tall. What is its volume?`,l*w*h,[`One layer has ${l} × ${w} = ${l*w} cubes.`,`There are ${h} layers: ${l*w} × ${h} = <b>${l*w*h}</b> cubes.`],{vis:vBox(l,w,h,{grid:true,labels:false}),unit:'cubes'})});
S('g3lines',3,'Parallel and perpendicular lines','Parallel lines never meet. Perpendicular lines cross at a square corner.',()=>{const k=P(['parallel','perpendicular','intersecting']);
  return choice('Which word describes these lines?',k,['parallel','perpendicular','intersecting'],[k==='parallel'?'The lines stay the same distance apart and never meet.':k==='perpendicular'?'The lines cross and make a square corner (90°).':'The lines cross, but not at a square corner.',`They are <b>${k}</b>.`],{vis:vLines(k)})});
S('g3solid',3,'Faces, edges and vertices','Faces are flat sides, edges are where faces meet, vertices are corners.',()=>{const S3=[['cube',6,12,8],['rectangular prism',6,12,8],['triangular prism',5,9,6],['square pyramid',5,8,5]],s=P(S3),w=R(1,3),W=['faces','edges','vertices'][w-1];
  return num(`How many <b>${W}</b> does this ${s[0]} have?`,s[w],[`Count the ones you can't see too.`,`A ${s[0]} has ${s[1]} faces, ${s[2]} edges and ${s[3]} vertices.`,`So it has <b>${s[w]}</b> ${W}.`],{vis:vSolid(s[0])})});
S('g3pic',3,'Picture graphs with a key','Count the symbols, then multiply by what each symbol is worth.',()=>{const k=P([2,5,10]),c=[R(1,6),R(1,6),R(1,6)],n=['Cats','Dogs','Fish'],t=R(0,1),i=R(0,2);
  const vis=`<div class="pgraph"><div class="label" style="text-align:center">Class pets</div>${c.map((x,j)=>`<div class="emo-row"><span class="lab">${n[j]}</span><span>${'⭐'.repeat(x)}</span></div>`).join('')}<div class="muted" style="text-align:center">Key: ⭐ = ${k} pets</div></div>`;
  if(t)return num(`How many <b>${n[i].toLowerCase()}</b> are there?`,c[i]*k,[`${n[i]} has ${c[i]} stars.`,`Each star is ${k}: ${c[i]} × ${k} = <b>${c[i]*k}</b>`],{vis});
  return num('How many pets are there in all?',sum(c)*k,[`Count all the stars: ${c.join(' + ')} = ${sum(c)}.`,`Each star is ${k}: ${sum(c)} × ${k} = <b>${sum(c)*k}</b>`],{vis})});
S('g3set',3,'Fraction of a set','Divide by the bottom number to make equal groups, then take the top number of groups.',()=>{const d=P([2,3,4,5]),a=R(1,d-1),n=d*R(2,6),it=P(ITEMS);
  return num(`What is <b>${a}/${d}</b> of <b>${n}</b> ${it}?`,a*n/d,[`Split ${n} into ${d} equal groups: ${n} ÷ ${d} = ${n/d}.`,`Take ${plural(a,'group')}: ${a} × ${n/d} = <b>${a*n/d}</b>`])});
S('g3bar',3,'Read a bar graph','Read across from the top of each bar to the numbers on the side.',()=>{const v=[1,2,3,4].map(()=>R(1,4)*5),C=['Soccer','Art','Music','Chess'];let i=R(0,3),j;do{j=R(0,3)}while(j===i);if(v[i]===v[j])v[j]=v[i]===20?15:v[i]+5;if(v[i]<v[j])[i,j]=[j,i];const df=coin();
  return num(df?`How many more students chose <b>${C[i]}</b> than <b>${C[j]}</b>?`:`How many students chose <b>${C[i]}</b> or <b>${C[j]}</b>?`,df?v[i]-v[j]:v[i]+v[j],[`Read the bars: ${C[i]} = ${v[i]}, ${C[j]} = ${v[j]}.`,df?`${v[i]} − ${v[j]} = <b>${v[i]-v[j]}</b>`:`${v[i]} + ${v[j]} = <b>${v[i]+v[j]}</b>`],{vis:vBars(C,v,5,20)})});
S('g3rect',3,'Missing side from the area','Width = area ÷ length.',()=>{const l=R(2,9),w=R(2,9);return num(`A rectangle has an area of <b>${l*w} square cm</b> and a length of <b>${l} cm</b>. What is its width?`,w,[`Area = length × width, so ${l} × ? = ${l*w}.`,`${l*w} ÷ ${l} = <b>${w}</b> cm`],{unit:'cm'})});
S('g3m10',3,'Multiply by 10 and 100','Multiplying by 10 adds one zero. By 100 adds two zeros.',()=>{const a=R(2,99),m=P([10,100]);return num(`<span class="big">${a} × ${m} = ?</span>`,a*m,[`Each digit moves ${m===10?'1 place':'2 places'} to the left.`,`Write ${m===10?'a zero':'two zeros'} on the end: <b>${fmtN(a*m)}</b>`])});
S('g3unitf',3,'Compare unit fractions','A unit fraction has 1 on top. The bigger the bottom, the smaller the piece.',()=>{let a,b;do{a=R(2,10);b=R(2,10)}while(a===b);const s=a<b?'>':'<';
  return choice(`Compare the fractions.<span class="big">1/${a} ○ 1/${b}</span>`,s,SIGNS,[`Both have 1 on top. Cutting into more pieces makes each piece smaller.`,`1/${Math.min(a,b)} is bigger than 1/${Math.max(a,b)}.`,`The answer is <b>${esc(s)}</b>.`],{optClass:'sym',cols:3,vis:`<div class="stack" style="justify-items:center">${vFracBar(a,1)}${vFracBar(b,1)}</div>`})});
/* ===== GRADE 4 ===== */
const P6=['hundred thousands','ten thousands','thousands','hundreds','tens','ones'],V6=[1e5,1e4,1e3,100,10,1];
S('g4pv',4,'Value of a digit (to 100,000s)','Name the place, then multiply the digit by that place value.',()=>{let d;do{d=range(1,6).map(()=>R(1,9))}while(new Set(d).size<6);const p=R(0,5),v=d[p]*V6[p];
  return num(`What is the value of the digit <b>${d[p]}</b> in <b>${fmtN(+d.join(''))}</b>?`,v,[`The ${d[p]} is in the ${P6[p]} place.`,`${d[p]} × ${fmtN(V6[p])} = <b>${fmtN(v)}</b>`])});
S('g4rnd',4,'Round large numbers','Look at the digit to the right of the place you are rounding to.',()=>{const p=P([10,100,1000,10000]),n=R(10001,999999);if(n%p===0)return SK.g4rnd.gen();return num(`Round <b>${fmtN(n)}</b> to the nearest <b>${fmtN(p)}</b>.`,Math.round(n/p)*p,roundSteps(n,p))});
S('g4add',4,'Add large numbers','Line up the places and add from the ones, carrying as you go.',()=>{const a=R(10000,600000),b=R(10000,999999-a);return num(`<span class="big">${fmtN(a)} + ${fmtN(b)} = ?</span>`,a+b,colAddSteps(a,b))});
S('g4sub',4,'Subtract large numbers','Line up the places. Regroup from the next place when you need to.',()=>{const a=R(100000,999999),b=R(10000,a-1);return num(`<span class="big">${fmtN(a)} − ${fmtN(b)} = ?</span>`,a-b,colSubSteps(a,b))});
S('g4mw',4,'Multi-step word problems','Solve one step at a time. Write down what you find after each step.',()=>{const n=P(NAMES),i=P(ITEMS),p=R(2,9),s=R(10,30),t=R(0,2);
  if(t===0){const a=R(50,200);return num(`${n} has ${a} ${i}. ${n} buys ${p} packs with ${s} ${i} in each pack. How many ${i} does ${n} have now?`,a+p*s,[`Step 1: new ${i}: ${p} × ${s} = ${p*s}.`,`Step 2: ${a} + ${p*s} = <b>${a+p*s}</b>`])}
  if(t===1){const a=p*s+R(5,40);return num(`${n} has ${a} ${i}. ${n} gives ${s} ${i} to each of ${p} friends. How many ${i} are left?`,a-p*s,[`Step 1: given away: ${p} × ${s} = ${p*s}.`,`Step 2: ${a} − ${p*s} = <b>${a-p*s}</b>`])}
  const c=R(3,9),pr=R(4,15),pay=Math.ceil(c*pr/10)*10+P([0,10,20]);return num(`${n} buys ${c} tickets at $${pr} each and pays with $${pay}. How much change does ${n} get (in dollars)?`,pay-c*pr,[`Step 1: cost: ${c} × $${pr} = $${c*pr}.`,`Step 2: $${pay} − $${c*pr} = <b>$${pay-c*pr}</b>`],{unit:'dollars'})});
S('g4mul1',4,'Multiply 3 digits by 1 digit','Break the big number into hundreds, tens and ones, multiply each part, then add.',()=>{const a=R(101,999),b=R(2,9),ps=splitParts(a);
  return num(`<span class="big">${a} × ${b} = ?</span>`,a*b,[`Break ${a} into ${ps.join(' + ')}.`,...ps.map(p=>`${p} × ${b} = ${fmtN(p*b)}`),`Add: ${ps.map(p=>fmtN(p*b)).join(' + ')} = <b>${fmtN(a*b)}</b>`])});
S('g4mul2',4,'Multiply 2 digits by 2 digits','Multiply by the tens, then by the ones, and add the two answers.',()=>{const a=R(12,60),b=R(12,40),t=Math.floor(b/10)*10,o=b%10;
  return num(`<span class="big">${a} × ${b} = ?</span>`,a*b,[`Break ${b} into ${t}${o?' + '+o:''}.`,`${a} × ${t} = ${fmtN(a*t)}`,...(o?[`${a} × ${o} = ${a*o}`,`${fmtN(a*t)} + ${a*o} = <b>${fmtN(a*b)}</b>`]:[`So ${a} × ${b} = <b>${fmtN(a*b)}</b>`])])});
S('g4div2',4,'Divide by 1 digit','Take out big easy chunks, like 10 or 100 groups, then add up the chunks.',()=>{const d=R(2,9),k=R(12,150),a=d*k,ch=[];let left=a,q=0;for(const c of[100,50,20,10,5,2,1]){while(left>=d*c){ch.push(`${d} × ${c} = ${d*c}, leaving ${left-d*c}`);left-=d*c;q+=c}}
  return num(`<span class="big">${a} ÷ ${d} = ?</span>`,k,[`Take out groups of ${d}:`,...ch,`Add the groups: <b>${k}</b>`])});
S('g4rem',4,'Division with remainders','Find the biggest multiple that fits. What is left over is the remainder.',()=>{const d=R(2,9),k=R(3,12),r=R(1,d-1),a=d*k+r,w=coin();
  return num(`${a} ÷ ${d}: what is the <b>${w?'remainder':'whole-number quotient'}</b>?`,w?r:k,[`${d} × ${k} = ${d*k} fits into ${a}. ${d} × ${k+1} = ${d*(k+1)} is too big.`,`${a} − ${d*k} = ${r} left over.`,`${a} ÷ ${d} = ${k} R ${r}, so the ${w?'remainder':'quotient'} is <b>${w?r:k}</b>.`])});
S('g4ord',4,'Order of operations','Brackets first, then multiply and divide, then add and subtract.',()=>{const a=R(2,9),b=R(2,9),c=R(2,9),t=R(0,3);
  if(t===0)return num(`<span class="big">${a} + ${b} × ${c} = ?</span>`,a+b*c,[`Multiply first: ${b} × ${c} = ${b*c}.`,`Then add: ${a} + ${b*c} = <b>${a+b*c}</b>`]);
  if(t===1)return num(`<span class="big">(${a} + ${b}) × ${c} = ?</span>`,(a+b)*c,[`Brackets first: ${a} + ${b} = ${a+b}.`,`Then multiply: ${a+b} × ${c} = <b>${(a+b)*c}</b>`]);
  if(t===2){const e=R(1,a*b-1);return num(`<span class="big">${a} × ${b} − ${e} = ?</span>`,a*b-e,[`Multiply first: ${a} × ${b} = ${a*b}.`,`Then subtract: ${a*b} − ${e} = <b>${a*b-e}</b>`])}
  return num(`<span class="big">${a*b} ÷ ${b} + ${c} = ?</span>`,a+c,[`Divide first: ${a*b} ÷ ${b} = ${a}.`,`Then add: ${a} + ${c} = <b>${a+c}</b>`])});
S('g4fac',4,'Factors','Find factor pairs: two numbers that multiply to make the number.',()=>{const n=P([12,16,18,20,24,28,30,32,36,40,42,45,48,50,54,60]),f=factors(n);
  if(coin(.4)){const nf=SH(range(2,n-1).filter(x=>n%x)).slice(0,3),a=P(f.filter(x=>x>1&&x<n));return mc(`Which number is a factor of <b>${n}</b>?`,a,nf,[`${a} × ${n/a} = ${n}, so ${a} is a factor.`,`The answer is <b>${a}</b>.`],{optClass:'sym'})}
  return num(`How many factors does <b>${n}</b> have?`,f.length,[`Factor pairs: ${f.filter(x=>x*x<=n).map(x=>x+' × '+n/x).join(', ')}.`,`Factors: ${f.join(', ')}.`,`That is <b>${f.length}</b> factors.`])});
S('g4prime',4,'Prime or composite','A prime number has exactly two factors: 1 and itself.',()=>{const n=R(2,60),f=range(2,n-1).find(x=>n%x===0);
  return choice(`Is <b>${n}</b> prime or composite?`,f?'composite':'prime',['prime','composite'],f?[`${n} = ${f} × ${n/f}.`,`It has more than two factors, so it is <b>composite</b>.`]:[`Try dividing by 2, 3, 5 and 7. None divide evenly.`,`Only 1 and ${n} are factors, so it is <b>prime</b>.`])});
S('g4pat',4,'Number patterns','Find the rule, then use it to find the next number.',()=>{const t=R(0,2);if(t<2){const d=R(3,15),up=t===0,b=up?R(1,30):R(5*d+1,5*d+40),T=range(0,4).map(i=>up?b+i*d:b-i*d);return num(`What is the next number?<span class="big">${T.slice(0,4).join(', ')}, __</span>`,T[4],[`Each number is ${d} ${up?'more':'less'} than the one before.`,`${T[3]} ${up?'+':'−'} ${d} = <b>${T[4]}</b>`])}
  const m=P([2,3]),b=R(1,4),T=range(0,4).map(i=>b*m**i);return num(`What is the next number?<span class="big">${T.slice(0,4).join(', ')}, __</span>`,T[4],[`Each number is ${m} times the one before.`,`${T[3]} × ${m} = <b>${T[4]}</b>`])});
S('g4var',4,'Evaluate expressions','Put the number in place of the letter, then calculate.',()=>{const a=R(2,9),n=R(2,9),b=R(1,9),s=a*n>b&&coin(.4),v=s?a*n-b:a*n+b;
  return num(`If <b>n = ${n}</b>, what is <b>${a}n ${s?'−':'+'} ${b}</b>?`,v,[`${a}n means ${a} × n = ${a} × ${n} = ${a*n}.`,`${a*n} ${s?'−':'+'} ${b} = <b>${v}</b>`])});
S('g4eqf',4,'Equivalent fractions','Multiply or divide the top and bottom by the same number.',()=>{const f=P([[1,2],[1,3],[2,3],[3,4],[2,5],[3,5],[5,6],[3,8]]),m=R(2,6);
  if(coin(.4))return num(`<span class="big">${f[0]*m}/${f[1]*m} = __/${f[1]}</span>Find the missing top number.`,f[0],[`The bottom went from ${f[1]*m} to ${f[1]}: that is ÷ ${m}.`,`Do the same to the top: ${f[0]*m} ÷ ${m} = <b>${f[0]}</b>`]);
  return num(`<span class="big">${f[0]}/${f[1]} = __/${f[1]*m}</span>Find the missing top number.`,f[0]*m,[`The bottom went from ${f[1]} to ${f[1]*m}: that is × ${m}.`,`Do the same to the top: ${f[0]} × ${m} = <b>${f[0]*m}</b>`])});
S('g4cmpf',4,'Compare fractions','Rename one fraction so both have the same bottom number.',()=>{const b=P([2,3,4,5]),m=R(2,4),d=b*m,a=R(1,b-1),c=R(1,d-1),s=cmpSign(a*m,c);
  return choice(`Compare the fractions.<span class="big">${a}/${b} ○ ${c}/${d}</span>`,s,SIGNS,[`Rename ${a}/${b} with a bottom of ${d}: ${a}/${b} = ${a*m}/${d}.`,`Compare the tops: ${a*m} and ${c}.`,`So ${a}/${b} ${signWord[s]} ${c}/${d}: <b>${esc(s)}</b>`],{optClass:'sym',cols:3})});
S('g4mix',4,'Mixed numbers','Divide the top by the bottom. The answer is the whole, the remainder is the new top.',()=>{const w=R(1,4),d=R(2,8),r=R(1,d-1),i=w*d+r;
  if(coin())return mc(`Write <b>${i}/${d}</b> as a mixed number.`,`${w} ${r}/${d}`,[`${w+1} ${r}/${d}`,`${w} ${d-r}/${d}`,`${r} ${w}/${d}`,`${w} ${r}/${i}`],[`${i} ÷ ${d} = ${w} remainder ${r}.`,`So ${i}/${d} = <b>${w} ${r}/${d}</b>.`],{optClass:'sym'});
  return num(`Write <b>${w} ${r}/${d}</b> as an improper fraction. What is the top number?`,i,[`Wholes into ${d}ths: ${w} × ${d} = ${w*d}.`,`Add the ${r}: ${w*d} + ${r} = ${i}.`,`So ${w} ${r}/${d} = <b>${i}</b>/${d}.`])});
S('g4dec',4,'Fractions as decimals','Tenths use one decimal place. Hundredths use two.',()=>{if(coin()){const n=R(1,9);return num(`Write <b>${n}/10</b> as a decimal.`,'0.'+n,[`${n}/10 is ${n} tenths.`,`Tenths are the first place after the decimal point: <b>0.${n}</b>`])}
  let n;do{n=R(1,99)}while(n%10===0);const s=String(n).padStart(2,'0');return num(`Write <b>${n}/100</b> as a decimal.`,'0.'+s,[`${n}/100 is ${n} hundredths.`,`Use two places after the decimal point: <b>0.${s}</b>`])});
S('g4dadd',4,'Add and subtract decimals','Line up the decimal points, then add or subtract like whole numbers.',()=>{let x,y,s;const ad=coin();do{x=R(101,899);y=R(101,899);if(!ad&&x<y)[x,y]=[y,x];s=ad?x+y:x-y}while(x%10===0||y%10===0||s%10===0||s<=0);const f=v=>(v/100).toFixed(2),o=ad?'+':'−';
  return num(`<span class="big">${f(x)} ${o} ${f(y)} = ?</span>`,f(s),[`Think in hundredths: ${x} ${o} ${y} = ${s}.`,`${s} hundredths = <b>${f(s)}</b>`])});
S('g4unit',4,'Convert units','A bigger unit holds many smaller units. Multiply to change big to small.',()=>{const u=P([['kilometre','metres',1000],['minute','seconds',60],['day','hours',24],['week','days',7],['metre','centimetres',100],['kilogram','grams',1000],['year','months',12]]),k=R(2,12);
  return num(`How many ${u[1]} are in <b>${k} ${u[0]}s</b>?`,k*u[2],[`1 ${u[0]} = ${fmtN(u[2])} ${u[1]}.`,`${k} × ${fmtN(u[2])} = <b>${fmtN(k*u[2])}</b>`])});
S('g4peri',4,'Missing side from the perimeter','Half the perimeter is length + width.',()=>{const l=R(5,25),w=R(3,20);
  return num(`A rectangle has a perimeter of <b>${2*(l+w)} cm</b>. Its length is <b>${l} cm</b>. What is its width?`,w,[`Length + width is half the perimeter: ${2*(l+w)} ÷ 2 = ${l+w}.`,`${l+w} − ${l} = <b>${w}</b> cm`],{unit:'cm',vis:svgWrap(260,120,`<rect x="40" y="18" width="180" height="${Math.max(30,Math.min(90,180*w/l))}" class="f-accs s-ink" style="stroke-width:3"/>${txt(130,12,l+' cm',{s:14})}${txt(34,18+Math.max(30,Math.min(90,180*w/l))/2+5,'?',{s:18,a:'end'})}`,'A rectangle with one side missing')})});
S('g4vol',4,'Volume of a box','Volume = length × width × height.',()=>{const l=R(2,9),w=R(2,9),h=R(2,9);

S('g4stem',4,'Stem-and-leaf plots','The stem is the tens digit and each leaf is a ones digit.',()=>{const rows=[1,2,3,4].map(s=>[s,range(1,R(1,4)).map(()=>R(0,9)).sort((x,y)=>x-y)]),t=R(0,2),all=rows.flatMap(([s,l])=>l.map(x=>s*10+x));

S('g5pf',5,'Prime factorization','Keep dividing by the smallest prime that works until you reach 1.',()=>{const n=P([12,18,20,24,28,30,36,40,42,44,45,48,50,52,54,56,60,63,66,70,72,75,80,84,90,96,98,100]),f=[],st=[];let m=n,p=2;while(m>1){if(m%p===0){st.push(`${m} ÷ ${p} = ${m/p}`);f.push(p);m/=p}else p++}const a=f.join(' × ');
